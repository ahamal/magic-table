<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Vision</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #fff; --ink: #161616; --muted: #74746f; --line: #dcdcd8; --hover: #f0f0ee;
    --accent: #1d4ed8; --accent-ink: #fff; --ok: #15803d; --bad: #dc2626; --soft: #fafaf8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0e0e; --panel: #161616; --ink: #e8e8e6; --muted: #8a8a86; --line: #2c2c2a; --hover: #1d1d1c;
      --accent: #3b82f6; --ok: #4ade80; --soft: #121212;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", sans-serif; }
  .mono, table { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 0; padding: 0 14px; height: 34px; cursor: pointer; }
  button:hover { background: var(--hover); }
  button.primary { background: #2e2e2e; color: #fff; border-color: transparent; font-weight: 600; }
  button.primary:hover { background: #444; }
  .ic { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  button:disabled { opacity: .45; cursor: default; }
  input, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 0; padding: 0 10px; height: 34px; width: 100%; min-width: 0; }
  input::placeholder { color: var(--muted); }
  input:focus, select:focus, button:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }

  header { display: flex; align-items: center; gap: 16px; height: 44px; padding: 0 20px; flex: none;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header b { font-size: 13px; letter-spacing: .08em; }
  .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .tag::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; background: currentColor; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .dot.ok { color: var(--ok); } .dot.bad { color: var(--bad); }
  .spacer { flex: 1; }
  header a { color: var(--accent); text-decoration: none; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px minmax(0, 1fr); }

  /* the query: camera, see, what, ask, find */
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; }
  aside section { padding: 22px 20px 24px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
  aside details { padding: 16px 20px; }
  h2 { margin: 0; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; display: flex;
    justify-content: space-between; align-items: baseline; }
  h2 span { font-size: 12px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); }
  .note { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .opt { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  .field > label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .seg { display: flex; } .seg button { flex: 1; } .seg button + button { margin-left: -1px; }
  .seg button.on { background: var(--hover); color: var(--ink); font-weight: 600; position: relative; z-index: 1; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; list-style: none; display: flex; align-items: center; gap: 6px; }
  details summary::-webkit-details-marker { display: none; }
  details .caret { transition: transform .15s; }
  details[open] .caret { transform: rotate(180deg); }
  details .field { margin-top: 10px; }

  /* the log: one line per action, opens on a click */
  /* the right side pages instead of scrolling: a page of lines, or one action opened */
  .results { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .bar { flex: none; display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 20px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  .bar b { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .bar .count { color: var(--muted); font-size: 12px; }
  .bar button { height: 30px; min-width: 34px; padding: 0 10px; }
  .bar button.icon { width: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .bar button.icon .ic { width: 18px; height: 18px; stroke-width: 1.8; }
  .bar button.icon { border-color: transparent; background: transparent; border-radius: 6px; color: var(--muted); }
  .bar button.icon:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  #back { margin-right: -8px; }
  .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
  .sep[hidden] { display: none; }
  .bar button[hidden] { display: none; }
  .titles { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
  .titles b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar.page { height: 52px; }
  .pill { display: inline-block; min-width: 20px; padding: 1px 7px; border-radius: 10px; background: var(--hover);
    color: var(--muted); font-size: 11px; font-weight: 600; text-align: center; letter-spacing: 0; }
  .titles.inline { flex-direction: row; align-items: baseline; gap: 10px; white-space: nowrap; overflow: hidden; }
  .titles .count { overflow: hidden; text-overflow: ellipsis; }
  .bar.page .count { white-space: nowrap; }
  .pages { color: var(--muted); font-size: 12px; margin-right: 4px; }
  .pages:empty { display: none; }
  .bar.page b { text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 600; }
  #log { flex: 1; min-height: 0; overflow: hidden; }
  #log:has(.item.open) { overflow-y: auto; }   /* the list pages to fit; an opened one scrolls */
  .item.hide { display: none; }
  .item { border-bottom: 1px solid var(--line); background: var(--panel); }
  .line { display: grid; grid-template-columns: 56px 76px 64px minmax(0, 1fr) auto 56px; gap: 16px; align-items: center;
    padding: 0 20px; height: 44px; cursor: pointer; }
  .line:hover { background: var(--hover); }
  .line .kind { font-weight: 700; font-size: 11px; letter-spacing: .06em; }
  .line .when, .line .by, .line .took { color: var(--muted); font-size: 12px; }
  .line .took { text-align: right; }
  .line .sum { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line .res { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .line .res.bad { color: var(--bad); } .line .res.ok { color: var(--ok); }
  .item.busy .line { color: var(--muted); cursor: default; }
  .detail { display: none; padding: 4px 20px 24px; background: var(--soft); border-top: 1px solid var(--line); }
  .item.open .detail { display: block; }
  .item.open .line { display: none; }
  .item.open { border-bottom: 0; }
  .item.open .detail { background: var(--panel); border-top: 0; padding: 20px; }
  .item.open .pic img { max-height: calc(100vh - 330px); width: auto; max-width: 100%; margin: 0 auto; }
  .item.open .pics.one { grid-template-columns: auto; justify-content: start; }
  .params { display: flex; flex-wrap: wrap; gap: 6px 20px; padding: 14px 0; font-size: 12px; color: var(--muted); }
  .params i { font-style: normal; color: var(--ink); }
  .pics { display: grid; grid-template-columns: 3fr 2fr; gap: 12px; margin-bottom: 16px; }
  .pics.one { grid-template-columns: minmax(0, 720px); }
  .pic { position: relative; background: #000; min-width: 0; }
  .pic img { display: block; width: 100%; height: auto; }
  .pic svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pic span { position: absolute; top: 6px; left: 6px; font-size: 11px; color: #fff; background: rgba(0,0,0,.55); padding: 2px 8px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; font-size: 12px; width: 100%; }
  th { text-align: left; font-weight: 600; color: var(--muted); padding: 6px 14px 6px 0; border-bottom: 1px solid var(--line); }
  td { padding: 7px 14px 7px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td.ans { white-space: normal; }
  td button { height: 26px; padding: 0 10px; font-size: 12px; }
  tr.off td { color: var(--muted); }
  tr.hot td { background: var(--hover); }
  .sw { display: inline-block; width: 9px; height: 9px; margin-right: 8px; }
  .answer { white-space: pre-wrap; max-width: 80ch; }
  .err { color: var(--bad); padding: 14px 0; }
  #empty { padding: 40px 20px; color: var(--muted); }
  @media (max-width: 1100px) { .line { grid-template-columns: 50px 74px minmax(0, 1fr) auto 48px; } .line .by { display: none; } }
  @media (max-width: 760px) {
    body { height: auto; }
    main { grid-template-columns: minmax(0, 1fr); }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    .line { grid-template-columns: 48px 64px minmax(0, 1fr) 48px; }
    .line .by, .line .res { display: none; }
    .pics { grid-template-columns: minmax(0, 1fr); }
    #log { min-height: 70vh; }
  }
</style>
</head>
<body>
<header>
  <b>VISION</b>
  <span id="conn" class="dot bad" title="offline"></span>
  <span class="spacer"></span>
  <a href="/">Home</a><a href="/jog">Jog</a><a href="/scene">3D Scene</a><a href="/talk">Talk</a>
</header>
<main>
  <aside>
    <section>
      <h2>See</h2>
      <div class="seg cams" id="seecam"><button data-cam="1" class="on">Cam 1</button><button data-cam="0">Cam 0</button><button data-cam="esper">Esper</button></div>
      <button class="primary" id="see">See what's on the board</button>
    </section>
    <section>
      <h2>Find</h2>
      <div class="seg cams" id="findcam"><button data-cam="1" class="on">Cam 1</button><button data-cam="0">Cam 0</button><button data-cam="esper">Esper</button></div>
      <div class="field">
        <label for="what">What</label>
        <input id="what">
      </div>
      <div class="field">
        <label for="ask">Ask about each <span class="opt">(optional)</span></label>
        <input id="ask">
      </div>
      <button class="primary" id="find">Find on board</button>
    </section>
    <details>
      <summary>Options<svg class="ic caret" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></summary>
      <div class="field">
        <label for="effort">How hard Muse Spark thinks</label>
        <select id="effort"><option>minimal</option><option>low</option><option>medium</option><option>high</option></select>
      </div>
    </details>
  </aside>
  <div class="results">
    <div class="bar">
      <div class="titles"><b id="title">Actions</b><span class="count" id="count"></span></div>
      <span class="spacer"></span>
      <span class="pages mono" id="pages"></span><button id="prev" class="icon" title="Newer (←)"><svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><button id="next" class="icon" title="Older (→)"><svg class="ic" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
      <span class="sep" id="sep" hidden></span><button id="back" class="icon" hidden title="Close (Esc)"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div id="log"><div id="empty">Every see, find and check shows up here, yours and agents', newest first. Click one to open it.</div></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const COLORS = ['#4fc3f7', '#ffb74d', '#81c784', '#f06292', '#ba68c8', '#fff176', '#4db6ac', '#ff8a65', '#9fa8da', '#e57373'];
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const num = (v, d = 0) => v == null ? '–' : v.toFixed(d);
const secs = ms => ms == null ? '' : (ms / 1000).toFixed(1) + ' s';
const camOf = id => $(id).querySelector('.on').dataset.cam;
const listed = new Set();     // action numbers already in the list (ours arrive by fetch and by websocket)

document.querySelectorAll('.cams').forEach(seg => seg.onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  [...seg.children].forEach(x => x.classList.toggle('on', x === b));
});

// ---- the log: a line per action; the detail is built when it arrives, shown on a click ----
function row(kind, sum) {
  $('empty')?.remove();
  const d = document.createElement('div'); d.className = 'item busy';
  d.innerHTML = `<div class="line"><span class="kind">${kind}</span><span class="when">${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}</span>
    <span class="by">you</span><span class="sum">${esc(sum)}</span><span class="res">working…</span><span class="took"></span></div><div class="detail"></div>`;
  d.querySelector('.line').onclick = () => { if (!d.classList.contains('busy') && opened == null) openItem(d); };
  $('log').prepend(d);
  while ($('log').children.length > 100) $('log').lastChild.remove();
  layout();
  return d;
}
function fill(d, r, res, cls) {
  d.classList.remove('busy');
  const l = d.querySelector('.line');
  l.querySelector('.when').textContent = new Date(r.at * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  l.querySelector('.by').textContent = r.by === 'vision' ? 'you' : r.by;
  l.querySelector('.res').textContent = res;
  l.querySelector('.res').className = 'res ' + (cls || '');
  l.querySelector('.took').textContent = secs(r.took_ms);
}
const kv = (k, v) => v == null || v === '' ? '' : `<span>${k} <i>${esc(v)}</i></span>`;
const picture = (r, c) => (r.pictures || []).includes(String(c)) ? `/api/vision/image?n=${r.n}&cam=${c}` : null;

async function show(r, d) {
  if (listed.has(r.n)) return;
  listed.add(r.n);
  const sum = r.kind === 'see' ? (r.ask || `cam ${r.cam}`) : r.kind === 'find' ? (r.what || []).join(', ') + (r.ask ? ` · ${r.ask}` : '')
    : r.kind === 'shape' ? `find ${r.find}` : `item ${r.id} · ${r.what}`;
  d = d || row(r.kind.toUpperCase(), sum);
  d.querySelector('.sum').textContent = sum;
  const det = d.querySelector('.detail');
  const names = w => (w || []).map(x => x.split('|')[0]).join(', ');
  d.dataset.title = r.kind === 'see' ? (r.ask ? `See · ${r.ask}` : 'See') : r.kind === 'find' ? names(r.what) + (r.ask ? ` · ${r.ask}` : '')
    : r.kind === 'shape' ? `Poly · ${[...new Set(r.items.map(i => i.what))].join(', ')}` : `Check · ${r.what}`;
  d.dataset.meta = [new Date(r.at * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }),
    r.by !== 'vision' ? `by ${r.by}` : '', r.cam != null && r.cam !== '1' && r.kind !== 'check' ? `cam ${r.cam}` : '', secs(r.took_ms)].filter(Boolean).join(' · ');

  if (r.kind === 'check') {
    fill(d, r, r.gone ? 'gone: picked up' : 'still there', r.gone ? 'ok' : 'bad');
    det.innerHTML = `<table><tr><th>item</th><th>what</th><th>camera</th><th>result</th><th>changed</th></tr>
      <tr><td>${r.id}</td><td>${esc(r.what)}</td><td>${esc(r.cam ?? '')}</td><td>${r.gone ? 'gone from its spot' : 'still there'}</td><td>${r.changed ?? '–'}</td></tr></table>`;
    return;
  }
  if (r.kind === 'shape') {
    const bad = r.items.filter(i => i.error).length;
    fill(d, r, bad ? `${r.items.length - bad} of ${r.items.length} modelled` : `${r.items.length} modelled`, bad ? 'bad' : '');
    det.innerHTML = `<div class="scroll"><table><tr><th>item</th><th>what</th><th>height</th><th>lies</th><th>parts</th><th>top</th></tr>
      ${r.items.map(it => { const s = it.shape; return `<tr><td>${it.id}</td><td>${esc(it.what)}</td>${s ? `<td>${num(s.height_mm)} mm</td><td>${s.axis === 'up' ? 'standing' : 'flat'}</td>
        <td>${s.parts.map(p => `<span class="sw" style="background:${esc(p.color)}"></span>${esc(p.shape)}`).join(' ')}</td><td>${esc(s.top)}</td>`
        : `<td colspan="4">${esc(it.error)}</td>`}</tr>`; }).join('')}</table></div>`;
    return;
  }
  if (r.kind === 'see') {
    fill(d, r, r.things ? r.things.map(t => `${t.count} ${t.name}`).join(', ') || 'nothing' : 'answered');
    const img = picture(r, r.cam);
    det.innerHTML = `<div class="pics one"><div class="pic">${img ? `<img src="${img}">` : ''}<span>cam ${esc(r.cam)}</span></div></div>` +
      (r.things ? `<table><tr><th>name</th><th>count</th><th>find with</th><th></th></tr>${r.things.map(t =>
        `<tr><td>${esc(t.name)}</td><td>${t.count}</td><td>${esc(t.find)}</td><td><button data-findthis="${esc(t.find)}" data-cam="${esc(r.cam)}">Find</button></td></tr>`).join('')}</table>`
        : `<div class="answer">${esc(r.answer)}</div>`);
    return;
  }
  // find
  const on = r.items.filter(i => i.on_board !== false);
  fill(d, r, on.length ? `${on.length} found` : 'nothing found', on.length ? '' : 'bad');
  const img = picture(r, r.cam);
  const [w, h] = r.size;
  const robotSvg = Object.entries(r.robot_masks || {}).map(([name, outlines]) => outlines.map(points =>
    `<polygon points="${points.map(q => q.join(',')).join(' ')}" fill="none" stroke="#e879f9" stroke-width="2" stroke-dasharray="8 5"><title>${esc(name)}, where it's tracked</title></polygon>`).join('')).join('');
  const svg = robotSvg + r.items.map(it => {
    const col = COLORS[it.id % COLORS.length];
    return `<g data-id="${it.id}"><polygon points="${it.outline.map(q => q.join(',')).join(' ')}" fill="${col}" fill-opacity="${it.on_board === false ? .12 : .35}" stroke="${col}" stroke-width="3"/>
      <text x="${it.box[0] + 4}" y="${it.box[1] + 24}" font-size="24" font-weight="700" fill="#fff" stroke="#000" stroke-width="4" paint-order="stroke">${it.id}</text></g>`;
  }).join('');
  det.innerHTML = `<div class="pics one">
      <div class="pic">${img ? `<img src="${img}">` : ''}<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${svg}</svg><span>cam ${esc(r.cam)}</span></div></div>
    <div class="scroll"><table><tr><th>id</th><th>what</th><th>found as</th><th>x, y mm</th><th>size mm</th><th>angle</th><th>cup room</th>${r.ask ? '<th>answer</th>' : ''}<th></th></tr>
    ${r.items.map(it => { const b = it.board || {}; return `<tr data-id="${it.id}" class="${it.on_board === false ? 'off' : ''}">
      <td><span class="sw" style="background:${COLORS[it.id % COLORS.length]}"></span>${it.id}</td><td>${esc(it.what)}</td><td>${esc(it.matched)}</td>
      <td>${it.board ? `${num(b.x)}, ${num(b.y)}` : `px ${it.box[0]}, ${it.box[1]}`}</td><td>${it.board ? `${num(b.w)} × ${num(b.h)}` : '–'}</td><td>${it.board ? num(b.angle) + '°' : '–'}</td>
      <td>${it.on_board === false ? 'off the board' : it.pick ? num(it.pick.clear_mm) + ' mm' + (it.robot?.near?.length ? ` · by ${esc(it.robot.near.join(', '))}` : '') : '–'}</td>
      ${r.ask ? `<td class="ans">${esc(it.answer)}</td>` : ''}
      <td>${it.on_board === false ? '' : `<button data-check="${it.id}" title="Did a pick take? Use it with the thing lifted">Check</button>`}</td></tr>`; }).join('')
      || '<tr><td colspan="9">nothing found</td></tr>'}</table></div>`;
  det.querySelectorAll('[data-id]').forEach(el => {          // hover a row or an outline: both light up
    const lit = v => det.querySelectorAll(`[data-id="${el.dataset.id}"]`).forEach(x => {
      if (x.tagName === 'TR') x.classList.toggle('hot', v); else x.querySelector('polygon').setAttribute('fill-opacity', v ? .6 : .35);
    });
    el.onmouseenter = () => lit(true); el.onmouseleave = () => lit(false);
  });
  det.querySelectorAll('[data-check]').forEach(b => b.onclick = () => check(+b.dataset.check));
}

async function run(url, kind, sum, open) {
  const d = row(kind, sum);
  try {
    const r = await fetch(url), j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    await show(j, d);
    if (open) openItem(d);
    return j;
  } catch (e) {
    d.classList.remove('busy');
    d.querySelector('.res').textContent = 'failed'; d.querySelector('.res').className = 'res bad';
    d.querySelector('.detail').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

// ---- paging: the list shows as many lines as fit; an opened action fills the space ----
let page = 0, opened = null;        // opened: the open action's element, or null for the list
const items = () => [...$('log').querySelectorAll('.item')];
const perPage = () => Math.max(1, Math.floor($('log').clientHeight / 45));
function layout() {
  const all = items(), n = all.length;
  if (opened && !opened.isConnected) opened = null;
  if (opened) {
    const i = all.indexOf(opened);
    all.forEach(d => { d.classList.toggle('hide', d !== opened); d.classList.toggle('open', d === opened); });
    $('title').textContent = opened.dataset.title || '';
    $('count').textContent = opened.dataset.meta || '';
    $('pages').textContent = ''; $('prev').hidden = $('next').hidden = false;
    $('prev').disabled = i <= 0; $('next').disabled = i >= n - 1;
  } else {
    const k = perPage(), pages = Math.max(1, Math.ceil(n / k));
    page = Math.min(page, pages - 1);
    all.forEach((d, i) => { d.classList.remove('open'); d.classList.toggle('hide', Math.floor(i / k) !== page); });
    $('title').textContent = 'Actions';
    $('count').innerHTML = n ? `<span class="pill">${n}</span>` : '';
    $('pages').textContent = pages > 1 ? `${page + 1} / ${pages}` : '';
    $('prev').hidden = $('next').hidden = pages < 2;
    $('prev').disabled = page <= 0; $('next').disabled = page >= pages - 1;
  }
  $('back').hidden = $('sep').hidden = !opened;
  document.querySelector('.bar').classList.toggle('page', !!opened);
  document.querySelector('.titles').classList.add('inline');
}
function openItem(d) { opened = d; layout(); }
$('back').onclick = () => { const i = items().indexOf(opened); opened = null; page = Math.floor(Math.max(i, 0) / perPage()); layout(); };
$('prev').onclick = () => { if (opened) { const a = items(); opened = a[a.indexOf(opened) - 1] || opened; } else page--; layout(); };
$('next').onclick = () => { if (opened) { const a = items(); opened = a[a.indexOf(opened) + 1] || opened; } else page++; layout(); };
addEventListener('keydown', e => {
  if (e.target.closest('input, select')) return;
  if (e.key === 'ArrowLeft' && !$('prev').disabled) $('prev').click();
  else if (e.key === 'ArrowRight' && !$('next').disabled) $('next').click();
  else if (e.key === 'Escape' && opened) $('back').click();
});
addEventListener('resize', layout);
layout();

// ---- see: names what's on the board; click a name to find it ----
$('see').onclick = async () => {
  const cam = camOf('seecam');
  $('see').disabled = true;
  await run(`/api/see?by=vision&cam=${cam}&effort=${$('effort').value}`, 'SEE', `cam ${cam}`, true);
  $('see').disabled = false;
};

// ---- find ----
$('find').onclick = async () => {
  const what = $('what').value.trim();
  if (!what) { $('what').focus(); return; }
  const cam = camOf('findcam');
  const q = new URLSearchParams({ what, cam, by: 'vision', effort: $('effort').value });
  if ($('ask').value.trim()) q.set('ask', $('ask').value.trim());
  $('find').disabled = true;
  await run('/api/find?' + q, 'FIND', what + (q.get('ask') ? ` · ${q.get('ask')}` : '') + ` · cam ${cam}`, true);
  $('find').disabled = false;
};
$('what').onkeydown = $('ask').onkeydown = e => { if (e.key === 'Enter') $('find').click() };

// ---- find from a see's list: that thing, on the camera that saw it ----
$('log').addEventListener('click', e => {
  const b = e.target.closest('[data-findthis]'); if (!b) return;
  $('what').value = b.dataset.findthis;
  [...$('findcam').children].forEach(x => x.classList.toggle('on', x.dataset.cam === b.dataset.cam));
  $('find').click();
});

// ---- check: from a find's item ----
async function check(id) {
  await run(`/api/find/check?by=vision&id=${id}`, 'CHECK', `item ${id}`, false);
}

// ---- live: anyone's actions (agents, the 3D scan) ----
function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => { $('conn').className = 'dot ok'; $('conn').title = 'connected'; };
  ws.onmessage = e => { const ev = JSON.parse(e.data); if (ev.type === 'vision' && ev.by !== 'vision') show(ev); };
  ws.onclose = () => { $('conn').className = 'dot bad'; $('conn').title = 'offline'; setTimeout(connect, 1500); };
}
fetch('/api/vision/history?limit=100').then(r => r.json()).then(async list => { for (const r of list.reverse()) await show(r); }).catch(() => {});   // kept on the Pi
connect();
</script>
