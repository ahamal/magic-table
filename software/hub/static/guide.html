<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Guide</title>
<style>
  :root { --bg: #f4f4f2; --panel: #fff; --ink: #161616; --muted: #74746f; --line: #dcdcd8; --accent: #1d4ed8; --code: #ececea; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0e0e0e; --panel: #161616; --ink: #e8e8e6; --muted: #8a8a86; --line: #2c2c2a; --accent: #3b82f6; --code: #222220; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
  nav { display: flex; gap: 14px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 13px; }
  nav a { color: var(--accent); text-decoration: none; }
  main { max-width: 780px; margin: 0 auto; padding: 8px 16px 48px; }
  h1 { font-size: 26px; margin: 24px 0 8px; } h2 { font-size: 18px; margin: 28px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  code { font: 13px ui-monospace, "SF Mono", Menlo, monospace; background: var(--code); padding: 1px 4px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; } td, th { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  li { margin: 3px 0; }
</style>
</head>
<body>
<nav><b>TABLE</b><a href="/">Home</a><a href="/jog">Jog</a><a href="/scene">3D Scene</a><a href="/vision">Vision</a><a href="/talk">Talk</a><a href="/guide">Start here</a><a href="/guide?doc=table">Table</a><a href="/guide?doc=mate">Mate</a><a href="/api/notes">Notes</a><a href="/api/guide">Plain text (for agents)</a></nav>
<main><div id="doc">Loading…</div><div id="notes"></div></main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
// ?doc=table|mate shows that guide; no doc = the start page, with this build's notes under it
const doc = new URLSearchParams(location.search).get('doc');
const render = (id, md) => {
  const el = document.getElementById(id);
  el.innerHTML = window.marked ? marked.parse(md) : '<pre>' + md.replace(/</g, '&lt;') + '</pre>';
  el.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    if (/^https?:/.test(href)) return;
    if (href.startsWith('../')) {                                 // elsewhere in the repo: on GitHub
      a.href = 'https://github.com/ahamal/magic-table/blob/main/' + href.slice(3);
    } else if (href.endsWith('.md')) {                            // another guide: stay on this page
      const name = href.replace(/\.md$/, '');
      a.href = name === 'README' ? '/guide' : '/guide?doc=' + name;
    }
  });
};
fetch(doc ? '/api/guide/' + doc : '/api/guide').then(r => r.text()).then(md => render('doc', md));
if (!doc) fetch('/api/notes').then(r => r.text()).then(md => render('notes', md));
</script>
</body>
</html>
