<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame Jog</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #fff; --ink: #161616; --muted: #74746f; --line: #dcdcd8; --hover: #ececea;
    --accent: #1d4ed8; --accent-ink: #fff; --target: #ea580c; --ok: #15803d; --warn: #a16207; --bad: #dc2626;
    --grid: #ebebe8; --table: #fafaf8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0e0e; --panel: #161616; --ink: #e8e8e6; --muted: #8a8a86; --line: #2c2c2a; --hover: #222220;
      --accent: #3b82f6; --target: #fb923c; --ok: #4ade80; --warn: #facc15; --grid: #212120; --table: #121212;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
    font: 12px/1.35 -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", sans-serif; }
  .mono, input, #log { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line);
    border-radius: 0; padding: 4px 8px; height: 26px; cursor: pointer; user-select: none; touch-action: manipulation; }
  button:hover { background: var(--hover); }
  button:active, button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; background: transparent; }
  input { font-size: 12px; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 0; padding: 3px 6px; height: 26px; min-width: 0; }
  input:focus, button:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
  /* buttons in a row share borders, like a segmented control */
  .seg { display: flex; }
  .seg > * + * { margin-left: -1px; }
  .seg > * { flex: 1; }

  /* top bar */
  header { display: flex; align-items: center; gap: 14px; height: 40px; padding: 0 12px; flex: none;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header b { font-size: 13px; letter-spacing: .08em; }
  .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .tag::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 5px; background: currentColor; }
  .tag.Idle { color: var(--ok); }
  .tag.Run, .tag.Jog, .tag.Home { color: var(--accent); }
  .tag.Hold, .tag.Door { color: var(--warn); }
  .tag.Alarm, .tag.Disconnected { color: var(--bad); }
  .dro { display: flex; gap: 16px; margin-left: 8px; font-size: 15px; font-variant-numeric: tabular-nums; }
  .dro span i { font-style: normal; color: var(--muted); margin-right: 5px; font-size: 12px; }
  .spacer { flex: 1; }
  .navlink { color: var(--accent); text-decoration: none; font-size: 12px; }
  #stop { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 700; letter-spacing: .06em;
    height: 28px; padding: 0 20px; }

  /* body: map left, controls right */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 12px; gap: 8px; }
  .map { flex: 1; min-height: 0; display: flex; gap: 10px; }
  .map #xy { flex: 1; min-width: 0; height: 100%; cursor: crosshair; touch-action: none; }
  .map #zrail { flex: none; width: 30px; height: 100%; cursor: ns-resize; touch-action: none; }
  .stage-foot { display: flex; align-items: center; gap: 12px; color: var(--muted); }
  .stage-foot .warn { color: var(--warn); }
  .stage-foot .warn[hidden] { display: none; }
  .stage-foot button { height: 22px; font-size: 11px; padding: 0 8px; }

  /* camera views under the map */
  .cams { flex: none; height: 36%; min-height: 140px; display: grid; grid-auto-flow: column;
    grid-auto-columns: minmax(0, 1fr); gap: 10px; }
  .cams[hidden] { display: none; }
  .cam { position: relative; min-width: 0; min-height: 0; background: #000; border: 1px solid var(--line); }
  .cam img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cam span, .cam a { position: absolute; top: 6px; font-size: 11px; color: #fff; background: rgba(0, 0, 0, .55);
    padding: 2px 6px; text-decoration: none; }
  .cam span { left: 6px; }
  .cam a { right: 6px; }
  .cam a:hover { background: var(--accent); }
  .cam .off { position: absolute; inset: 0; display: grid; place-items: center; color: #999; }

  aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  aside section { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  aside h2 { margin: 0 0 8px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    display: flex; justify-content: space-between; }
  aside h2 span { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .stack { display: flex; flex-direction: column; gap: 6px; }

  /* jog pad */
  .jog { display: grid; grid-template-columns: repeat(3, 1fr) 10px 1fr; gap: 0; }
  .jog button { height: 38px; font-size: 15px; margin: 0 -1px -1px 0; }
  .jog .gap { grid-column: 4; }
  .jog .muted { font-size: 10px; color: var(--muted); }
  .speed { display: flex; align-items: center; gap: 8px; }
  .speed input[type=range] { flex: 1; height: auto; padding: 0; border: 0; accent-color: var(--accent); }
  .speed output { width: 12ch; text-align: right; white-space: nowrap; }

  .xyz { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .xyz label { display: flex; align-items: center; margin-right: -1px; }
  .xyz label i { font-style: normal; color: var(--muted); padding: 0 6px; border: 1px solid var(--line); border-right: 0;
    height: 26px; line-height: 24px; }
  .xyz input { flex: 1; width: 100%; }
  .mpos { color: var(--muted); font-size: 11px; }

  /* console */
  .console { flex: 1; min-height: 0; display: flex; flex-direction: column; border-bottom: 0; }
  #log { flex: 1; min-height: 60px; overflow: auto; font-size: 11px; white-space: pre-wrap; word-break: break-all;
    border: 1px solid var(--line); background: var(--table); padding: 6px; }
  #log .out { color: var(--accent); }
  #log .err { color: var(--bad); }
  #log .sys { color: var(--muted); }
  #cmdform { display: flex; margin-top: -1px; }
  #cmdform input { flex: 1; }
  #cmdform button { margin-left: -1px; }
  .quick { margin-top: 6px; }
  .quick button { font-size: 11px; height: 22px; padding: 0 6px; }
  kbd { font: 10px ui-monospace, Menlo, monospace; color: var(--muted); }

  @media (max-width: 760px) {
    body { height: auto; }
    main { grid-template-columns: minmax(0, 1fr); }
    .map { height: 60vh; flex: none; }
    .cams { height: auto; grid-auto-flow: row; }
    .cam { aspect-ratio: 4 / 3; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    .dro { font-size: 13px; gap: 10px; }
    header { gap: 10px; }
    #homed { display: none; }
  }
</style>
</head>
<body>
<header>
  <b>FRAME</b>
  <span id="state" class="tag">…</span>
  <span id="homed" class="tag">not homed</span>
  <div class="dro mono">
    <span><i>X</i><span id="wx">–</span></span>
    <span><i>Y</i><span id="wy">–</span></span>
    <span><i>Z</i><span id="wz">–</span></span>
  </div>
  <span class="spacer"></span>
  <a href="/" class="navlink">Home</a><a href="/scene" class="navlink">3D Scene</a><a href="/vision" class="navlink">Vision</a><a href="/talk" class="navlink">Talk</a>
  <button id="stop" title="Feed hold, then reset (Esc)">STOP</button>
</header>

<main>
  <div class="stage">
    <div class="map">
      <svg id="xy" role="img" aria-label="XY table: click to set a target"></svg>
      <svg id="zrail" role="img" aria-label="Z rail: click to set a target height"></svg>
    </div>
    <div class="cams" id="cams"></div>
    <div class="stage-foot">
      <span>Click the table or Z rail to set a target</span>
      <span id="unhomed" class="warn">· Not homed: 0,0 is wherever it was at power-on</span>
      <span class="spacer"></span>
      <span id="travel" class="mono"></span>
      <button id="camtoggle" title="Show or hide the live camera views">Cameras</button>
    </div>
  </div>

  <aside>
    <section>
      <h2>Jog <span><kbd>←→↑↓</kbd> <kbd>PgUp/Dn</kbd> · hold to keep moving</span></h2>
      <div class="stack">
        <div class="seg" id="steps"></div>
        <div class="jog">
          <button data-jog="-1,1,0">↖</button><button data-jog="0,1,0">↑</button><button data-jog="1,1,0">↗</button>
          <span class="gap"></span><button data-jog="0,0,1">Z+</button>
          <button data-jog="-1,0,0">←</button><button class="muted" id="padzero">0,0</button><button data-jog="1,0,0">→</button>
          <span class="gap"></span><span></span>
          <button data-jog="-1,-1,0">↙</button><button data-jog="0,-1,0">↓</button><button data-jog="1,-1,0">↘</button>
          <span class="gap"></span><button data-jog="0,0,-1">Z−</button>
        </div>
        <div class="speed"><span>Speed</span>
          <input id="feed" type="range" min="200" max="9000" step="100" value="3000">
          <output id="feedv" class="mono"></output></div>
      </div>
    </section>

    <section>
      <h2>Target</h2>
      <div class="stack">
        <div class="xyz">
          <label><i>X</i><input id="tx" type="number" step="0.1"></label>
          <label><i>Y</i><input id="ty" type="number" step="0.1"></label>
          <label><i>Z</i><input id="tz" type="number" step="0.1"></label>
        </div>
        <div class="seg"><button id="go">Go</button><button id="here">Set to here</button><button id="gozero">Go 0,0</button></div>
      </div>
    </section>

    <section>
      <h2>Work zero <span id="mpos" class="mpos mono">machine <span id="mx"></span> <span id="my"></span> <span id="mz"></span></span></h2>
      <div class="seg">
        <button data-zero="X">X</button><button data-zero="Y">Y</button><button data-zero="Z">Z</button><button data-zero="XYZ">All</button>
      </div>
    </section>

    <section>
      <h2>Machine</h2>
      <div class="seg">
        <button id="home">Home</button><button id="unlock">Unlock</button>
        <button id="hold">Pause</button><button id="resume">Resume</button><button id="reset">Reset</button>
      </div>
    </section>

    <section>
      <h2>Gripper <span><kbd>G</kbd> grip · <kbd>D</kbd> drop</span></h2>
      <div class="seg">
        <button id="pump" title="Pump on/off (M8/M9)">Pump</button><button id="valve" title="Vent valve open/closed (M4 S0/M3 S0)">Valve</button>
        <button id="grip">Grip</button><button id="drop">Drop</button>
      </div>
    </section>

    <section class="console">
      <h2>Console</h2>
      <div id="log"></div>
      <form id="cmdform">
        <input id="cmd" list="cmds" placeholder="G-code or $ command" autocomplete="off">
        <button>Send</button>
      </form>
      <datalist id="cmds"></datalist>
      <div class="seg quick">
        <button data-cmd="$$">$$</button><button data-cmd="$#">$#</button>
        <button data-cmd="$I">$I</button><button data-cmd="$G">$G</button><button data-cmd="$N">$N</button>
      </div>
    </section>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
const STEPS = [0.1, 1, 10, 50, 100];
const HOLD_MS = 250;      // press longer than this = continuous jog
const HOLD_REACH = 300;   // continuous jog target distance, cancelled on release

let st = { state: 'Disconnected' };
let travel = { X: 350, Y: 580, Z: 300 };
let step = 10;
let target = null;        // {x, y, z} in work coords

// ---- API ----
const api = (path, body) => fetch('/api/' + path, {
  method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: body ? JSON.stringify(body) : undefined,
}).then(r => r.json()).catch(e => ({ reply: 'error:' + e.message }));
const send = line => api('send', { line });
const rt = name => api('realtime/' + name);
const feed = () => +$('feed').value;

// ---- log ----
function log(text, cls) {
  const el = $('log'), atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 30;
  const d = document.createElement('div');
  d.className = cls; d.textContent = text;
  el.append(d);
  while (el.childElementCount > 400) el.firstChild.remove();
  if (atBottom) el.scrollTop = el.scrollHeight;
}

// ---- live link ----
function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'status') render(ev);
    else if (ev.type === 'scene') boardFrom(ev);
    else if (ev.type === 'settings') applySettings(ev.settings);
    else if (ev.type === 'gripper') renderGripper(ev);
    else if (ev.type === 'log') log((ev.dir === 'out' ? '> ' : '') + ev.text,
      ev.text.startsWith('error') || ev.text.startsWith('ALARM') ? 'err' : ev.dir);
  };
  ws.onclose = () => { render({ state: 'Disconnected' }); setTimeout(connect, 1500); };
  setInterval(() => ws.readyState === 1 && ws.send('ping'), 10000);
}

function applySettings(s) {
  if (s['$130']) travel = { X: s['$130'], Y: s['$131'], Z: s['$132'] };
  if (s['$110']) $('feed').max = Math.max(s['$110'], s['$111']);
  $('travel').textContent = `travel ${travel.X} × ${travel.Y} × ${travel.Z} mm`;
  drawMap();
}

function render(s) {
  st = s;
  const state = (s.state || '').split(':')[0];
  $('state').textContent = s.state; $('state').className = 'tag ' + state;
  $('homed').textContent = s.homed ? 'homed' : 'not homed';
  $('homed').className = 'tag ' + (s.homed ? 'Idle' : '');
  $('unhomed').hidden = !!s.homed;
  const w = s.WPos || [NaN, NaN, NaN], m = s.MPos || [NaN, NaN, NaN];
  ['x', 'y', 'z'].forEach((a, i) => {
    $('w' + a).textContent = isNaN(w[i]) ? '–' : w[i].toFixed(2);
    $('m' + a).textContent = isNaN(m[i]) ? '' : m[i].toFixed(2);
  });
  const busy = state !== 'Idle';
  $('go').disabled = busy || !target;
  updateHead();
}

// ---- map ----
// The board, from above, in work coordinates: 0,0 is its middle, X right, Y up. The dot is the
// head (what Go and the readout use); the cup hangs TIP from it, so the cup's reach is drawn as
// where the head can be (shifted by TIP). Markers and Mate are where the cameras see them.
const PAD = 12, TIP = [0.6, -24.7], ZMIN = -1, ZMAX = 150;
let board = { bounds: [-210, 210, -191, 191], markers: {}, mate: null };
const view = () => { const b = board.bounds, m = 50;          // the board: the cup's reach plus the marker margin
  return [b[0] - m, b[1] + m, b[2] - m, b[3] - TIP[1] + m]; };
const sx = x => x, sy = y => -y;                                // SVG y runs down

function el(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent && parent.append(e);
  return e;
}

function drawMap() {
  const xy = $('xy'), zr = $('zrail');
  xy.innerHTML = zr.innerHTML = '';
  const [x0, x1, y0, y1] = view(), b = board.bounds;
  xy.setAttribute('viewBox', `${x0 - PAD} ${-y1 - PAD} ${x1 - x0 + 2 * PAD} ${y1 - y0 + 2 * PAD}`);
  el('rect', { x: x0, y: -y1, width: x1 - x0, height: y1 - y0, rx: 4, fill: '#1b1b1b' }, xy);
  for (let x = Math.ceil(x0 / 50) * 50; x < x1; x += 50) el('line', { x1: x, y1: -y1, x2: x, y2: -y0, stroke: '#2a2a2a' }, xy);
  for (let y = Math.ceil(y0 / 50) * 50; y < y1; y += 50) el('line', { x1: x0, y1: -y, x2: x1, y2: -y, stroke: '#2a2a2a' }, xy);
  // the cup's reach (head coordinates)
  el('rect', { x: b[0] - TIP[0], y: -(b[3] - TIP[1]), width: b[1] - b[0], height: b[3] - b[2], fill: 'none',
    stroke: '#d9822b', 'stroke-dasharray': '6 5', 'stroke-width': 1.2 }, xy);
  for (const m of Object.values(board.markers)) {                 // board markers, ~30 mm
    el('rect', { x: m.x - 19, y: -m.y - 19, width: 38, height: 38, fill: '#f4f4f2' }, xy);
    el('rect', { x: m.x - 13, y: -m.y - 13, width: 26, height: 26, fill: '#1b1b1b' }, xy);
  }
  if (board.mate) {                                              // Mate's body, ~90 x 100 mm
    const g = el('g', { transform: `translate(${board.mate.x} ${-board.mate.y}) rotate(${-board.mate.heading})` }, xy);
    el('rect', { x: -50, y: -45, width: 100, height: 90, rx: 6, fill: '#c9a46c', opacity: .85 }, g);
  }
  // 0,0: the middle of the board
  el('line', { x1: -10, y1: 0, x2: 10, y2: 0, stroke: '#888' }, xy);
  el('line', { x1: 0, y1: -10, x2: 0, y2: 10, stroke: '#888' }, xy);
  el('text', { x: 6, y: -6, 'font-size': 13, fill: '#999' }, xy).textContent = '0,0';
  el('line', { id: 'path', stroke: 'var(--target)', 'stroke-dasharray': '4 4', 'stroke-width': 1.5 }, xy);
  const t = el('g', { id: 'tmark', visibility: 'hidden' }, xy);
  el('circle', { r: 9, fill: 'none', stroke: 'var(--target)', 'stroke-width': 2 }, t);
  el('line', { x1: -14, x2: 14, stroke: 'var(--target)', 'stroke-width': 1.5 }, t);
  el('line', { y1: -14, y2: 14, stroke: 'var(--target)', 'stroke-width': 1.5 }, t);
  const h = el('g', { id: 'head' }, xy);
  el('circle', { r: 8, fill: 'var(--accent)' }, h);
  el('circle', { r: 3, fill: '#fff' }, h);

  zr.setAttribute('viewBox', `-22 ${-PAD} 44 ${ZMAX - ZMIN + 2 * PAD}`);
  zr.setAttribute('preserveAspectRatio', 'none');
  el('rect', { x: -6, y: 0, width: 12, height: ZMAX - ZMIN, fill: 'var(--table)', stroke: 'var(--line)' }, zr);
  el('rect', { x: -10, y: ZMAX - 0 - 1, width: 20, height: 2, fill: 'var(--muted)' }, zr);   // the board: Z 0
  el('rect', { id: 'ztarget', x: -18, width: 36, height: 3, fill: 'var(--target)', visibility: 'hidden' }, zr);
  el('rect', { id: 'zhead', x: -14, width: 28, height: 6, rx: 3, fill: 'var(--accent)' }, zr);
  updateHead(); updateTarget();
}

const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
const zy = z => ZMAX - clamp(z, ZMIN, ZMAX);                   // Z rail: 150 at the top, the board near the bottom

function updateHead() {
  if (!$('head')) return;
  const w = st.WPos;
  $('head').setAttribute('visibility', w ? 'visible' : 'hidden');
  $('zhead').setAttribute('visibility', w ? 'visible' : 'hidden');
  if (!w) return updatePath();
  $('head').setAttribute('transform', `translate(${sx(w[0])} ${sy(w[1])})`);
  $('zhead').setAttribute('y', zy(w[2]) - 3);
  updatePath();
}

function updateTarget() {
  const show = !!target;
  if (!$('tmark')) return;
  $('tmark').setAttribute('visibility', show ? 'visible' : 'hidden');
  $('ztarget').setAttribute('visibility', show ? 'visible' : 'hidden');
  if (show) {
    $('tmark').setAttribute('transform', `translate(${sx(target.x)} ${sy(target.y)})`);
    $('ztarget').setAttribute('y', zy(target.z) - 1.5);
    $('tx').value = target.x.toFixed(1); $('ty').value = target.y.toFixed(1); $('tz').value = target.z.toFixed(1);
  }
  $('go').disabled = !show || (st.state || '') !== 'Idle';
  updatePath();
}

function updatePath() {
  const p = $('path'), w = st.WPos; if (!p) return;
  if (!target || !w) { p.setAttribute('visibility', 'hidden'); return; }
  p.setAttribute('visibility', 'visible');
  p.setAttribute('x1', sx(w[0])); p.setAttribute('y1', sy(w[1]));
  p.setAttribute('x2', sx(target.x)); p.setAttribute('y2', sy(target.y));
}

function svgPoint(svg, e) {
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

function currentOr0() { const w = st.WPos || [0, 0, 0]; return { x: w[0], y: w[1], z: w[2] }; }

$('xy').addEventListener('pointerdown', e => {
  const p = svgPoint($('xy'), e), [x0, x1, y0, y1] = view();
  target = { ...(target || currentOr0()), x: +clamp(p.x, x0, x1).toFixed(1), y: +clamp(-p.y, y0, y1).toFixed(1) };
  updateTarget();
});
$('zrail').addEventListener('pointerdown', e => {
  const p = svgPoint($('zrail'), e);
  target = { ...(target || currentOr0()), z: +clamp(ZMAX - p.y, ZMIN, ZMAX).toFixed(1) };
  updateTarget();
});
['tx', 'ty', 'tz'].forEach(id => $(id).addEventListener('change', () => {
  target = { x: +$('tx').value || 0, y: +$('ty').value || 0, z: +$('tz').value || 0 };
  updateTarget();
}));
$('here').onclick = () => { target = currentOr0(); updateTarget(); };
$('go').onclick = () => target && api('move', { ...target, feed: feed() });
$('gozero').onclick = $('padzero').onclick = () => api('move', { x: 0, y: 0, feed: feed() });

// the board from the cameras: reach, markers, Mate (refreshed with each scene)
function boardFrom(s) {
  if (!s || !s.calibrated) return;
  const mate = s.mate ? { x: s.mate.x, y: s.mate.y, heading: s.mate.heading } : null;
  const same = JSON.stringify(s.bounds) === JSON.stringify(board.bounds) && Object.keys(s.board || {}).length === Object.keys(board.markers).length
    && (!mate === !board.mate) && (!mate || Math.hypot(mate.x - board.mate.x, mate.y - board.mate.y) < 3);
  board = { bounds: s.bounds || board.bounds, markers: s.board || {}, mate };
  if (!same) drawMap();
}
fetch('/api/scene').then(r => r.json()).then(boardFrom).catch(() => {});

// ---- jog ----
STEPS.forEach((s, i) => {
  const b = document.createElement('button');
  b.textContent = s; b.dataset.step = s;
  b.onclick = () => setStep(s);
  $('steps').append(b);
});
function setStep(s) {
  step = s;
  document.querySelectorAll('[data-step]').forEach(b => b.classList.toggle('on', +b.dataset.step === s));
}
setStep(step);

const zFeed = () => Math.min(feed(), 3000);
function jog(dir, dist) {
  const [dx, dy, dz] = dir;
  return api('jog', { x: dx * dist, y: dy * dist, z: dz * dist, feed: dz ? zFeed() : feed() });
}

// press: after HOLD_MS switch to a long jog that is cancelled on release
function holdable(btn, dir) {
  let timer = null, holding = false;
  const start = e => {
    e.preventDefault();
    if (timer || holding) return;
    btn.classList.add('on');
    timer = setTimeout(() => { timer = null; holding = true; jog(dir, HOLD_REACH); }, HOLD_MS);
  };
  const end = () => {
    btn.classList.remove('on');
    if (timer) { clearTimeout(timer); timer = null; jog(dir, step); }
    else if (holding) { holding = false; rt('jog_cancel'); }
  };
  return { start, end };
}

document.querySelectorAll('[data-jog]').forEach(btn => {
  const h = holdable(btn, btn.dataset.jog.split(',').map(Number));
  btn.addEventListener('pointerdown', h.start);
  btn.addEventListener('pointerup', h.end);
  btn.addEventListener('pointerleave', e => e.buttons && h.end());
  btn.addEventListener('pointercancel', h.end);
});

const KEYS = { ArrowLeft: '-1,0,0', ArrowRight: '1,0,0', ArrowUp: '0,1,0', ArrowDown: '0,-1,0',
  PageUp: '0,0,1', PageDown: '0,0,-1' };
const keyHolds = {};
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') { stop(); return; }
  if (/^[1-5]$/.test(e.key)) { setStep(STEPS[+e.key - 1]); return; }
  const j = KEYS[e.key]; if (!j) return;
  e.preventDefault();
  if (e.repeat || keyHolds[e.key]) return;
  const btn = document.querySelector(`[data-jog="${j}"]`);
  keyHolds[e.key] = holdable(btn, j.split(',').map(Number));
  keyHolds[e.key].start(e);
});
addEventListener('keyup', e => { const h = keyHolds[e.key]; if (h) { delete keyHolds[e.key]; h.end(); } });
addEventListener('blur', () => { for (const k in keyHolds) { keyHolds[k].end(); delete keyHolds[k]; } });

$('feed').oninput = () => $('feedv').textContent = feed() + ' mm/min';
$('feed').oninput();

// ---- zero, machine ----
document.querySelectorAll('[data-zero]').forEach(b => b.onclick = () =>
  send('G10 L20 P1 ' + [...b.dataset.zero].map(a => a + '0').join(' ')));

function stop() { rt('hold'); setTimeout(() => rt('reset'), 150); }
$('stop').onclick = stop;
$('home').onclick = () => api('home');
$('unlock').onclick = () => send('$X');
$('hold').onclick = () => rt('hold');
$('resume').onclick = () => rt('resume');
$('reset').onclick = () => rt('reset');

// ---- gripper ----
let grip = { pump: false, valve: false };
function renderGripper(g) {
  grip = g;
  $('pump').classList.toggle('on', g.pump);
  $('valve').classList.toggle('on', g.valve);
}
const gripper = name => api('gripper/' + name).then(r => {
  if (r.error) log(r.error, 'err');
  if ('pump' in r) renderGripper(r);
});
$('pump').onclick = () => gripper(grip.pump ? 'pump_off' : 'pump_on');
$('valve').onclick = () => gripper(grip.valve ? 'valve_off' : 'valve_on');
$('grip').onclick = () => gripper('grip');
$('drop').onclick = () => gripper('drop');
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.repeat || e.metaKey || e.ctrlKey) return;
  if (e.key === 'g') gripper('grip');
  else if (e.key === 'd') gripper('drop');
});

// ---- cameras ----
// Live MJPEG views. Streams stop while hidden (toggle or background tab) to spare the Wi-Fi.
let camsOn = true;
try { camsOn = localStorage.getItem('cams') !== 'off'; } catch (e) {}
let camList = [];

function camSrc(c) { return `/api/stream?cam=${c.cam}&fps=8&t=${Date.now()}`; }
function setStreams(on) {
  document.querySelectorAll('.cam img').forEach(img => {
    img.src = on ? camSrc({ cam: img.dataset.cam }) : '';
  });
}
function showCams() {
  const live = camsOn && !document.hidden;
  $('cams').hidden = !camsOn || !camList.length;
  $('camtoggle').classList.toggle('on', camsOn);
  setStreams(live);
  drawMap();
}
fetch('/api/cameras').then(r => r.json()).then(list => {
  camList = list;
  $('camtoggle').hidden = !list.length;
  list.forEach(c => {
    const d = document.createElement('div');
    d.className = 'cam';
    if (c.ok) {
      d.innerHTML = `<img data-cam="${c.cam}" alt="Camera ${c.cam}"><span>cam ${c.cam} · ${c.model}</span>` +
        `<a href="/api/capture?cam=${c.cam}" target="_blank" title="Full-size photo">Photo ↗</a>`;
    } else {
      d.innerHTML = `<span>cam ${c.cam} · ${c.model}</span><div class="off">not running</div>`;
    }
    $('cams').append(d);
  });
  showCams();
}).catch(() => { $('camtoggle').hidden = true; $('cams').hidden = true; });
$('camtoggle').onclick = () => {
  camsOn = !camsOn;
  try { localStorage.setItem('cams', camsOn ? 'on' : 'off'); } catch (e) {}
  showCams();
};
document.addEventListener('visibilitychange', () => setStreams(camsOn && !document.hidden));

// ---- console ----
const COMMANDS = [
  ['$$', 'View all GRBL settings'], ['$#', 'View G-code parameters'], ['$G', 'View parser state'],
  ['$I', 'View build info'], ['$N', 'View startup blocks'], ['$C', 'Check G-code mode'],
  ['$X', 'Kill alarm lock'], ['$H', 'Run homing cycle'], ['$J=G91 X10 F1000', 'Jog'],
  ['$SLP', 'Sleep mode'], ['G21', 'Units: millimetres'], ['G90', 'Absolute positioning'],
  ['G91', 'Relative positioning'], ['G0 X0 Y0', 'Rapid to work 0,0'],
  ['G10 L20 P1 X0 Y0 Z0', 'Set current position as work zero'],
  ['M8', 'Pump on'], ['M9', 'Pump off'], ['M4 S0', 'Vent valve open'], ['M3 S0', 'Vent valve closed'],
];
COMMANDS.forEach(([c, d]) => { const o = document.createElement('option'); o.value = c; o.label = d; $('cmds').append(o); });
const history = []; let hi = 0;
$('cmdform').onsubmit = e => {
  e.preventDefault();
  const line = $('cmd').value.trim(); if (!line) return;
  history.push(line); hi = history.length; $('cmd').value = '';
  if (line === '?') rt('status'); else if (line === '!') rt('hold');
  else if (line === '~') rt('resume'); else send(line);
};
$('cmd').addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' && hi > 0) { $('cmd').value = history[--hi]; e.preventDefault(); }
  if (e.key === 'ArrowDown') { hi = Math.min(hi + 1, history.length); $('cmd').value = history[hi] || ''; }
});
document.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => send(b.dataset.cmd));

drawMap();
connect();
</script>
</body>
</html>
