<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Scene</title>
<style>
  :root { --bg: #f4f4f2; --panel: rgba(255,255,255,.92); --ink: #161616; --muted: #74746f; --line: #dcdcd8;
    --accent: #1d4ed8; --ok: #15803d; --warn: #a16207; --bad: #dc2626; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0e0e0e; --panel: rgba(22,22,22,.92); --ink: #e8e8e6; --muted: #8a8a86;
      --line: #2c2c2a; --accent: #3b82f6; --ok: #4ade80; --warn: #facc15; --bad: #f87171; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  .hud { position: fixed; top: 12px; left: 12px; width: 270px; max-width: calc(100vw - 24px); background: var(--panel);
    border: 1px solid var(--line); padding: 16px; backdrop-filter: blur(6px); display: flex; flex-direction: column; gap: 14px; }
  .hud .top { display: flex; align-items: center; gap: 8px; }
  .hud .top b { font-size: 12px; letter-spacing: .08em; white-space: nowrap; }
  .hud .links { margin-left: auto; display: flex; gap: 10px; white-space: nowrap; }
  .hud .links a { color: var(--accent); text-decoration: none; }
  .hud .links a:hover { text-decoration: underline; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
  .rows { display: flex; flex-direction: column; gap: 4px; }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .row span:first-child { color: var(--muted); }
  .ic { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  button { flex: 1; font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); height: 32px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
  button:hover { background: rgba(127,127,127,.12); }
  button:disabled { opacity: .4; cursor: default; }
  /* buttons in a grid share their borders */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; }
  #calstop { grid-column: 1 / -1; color: var(--bad); font-weight: 600; }
  #calstop[hidden] { display: none; }
  .grid2 button { margin: 0 -1px -1px 0; }
  .fold { flex: none; justify-content: flex-start; height: 34px; padding: 0 10px 0 12px; width: 100%; }
  .fold .state { margin-left: auto; font-size: 11px; display: inline-flex; align-items: center; gap: 6px; }
  .fold .chev { transition: transform .15s; }
  .fold.open .chev { transform: rotate(180deg); }
  #calbox { display: flex; flex-direction: column; gap: 14px; margin-top: -4px; }
  #calbox[hidden] { display: none; }
  /* scan: a button of its own, top right; what it found under it */
  .scan { position: fixed; top: 12px; right: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #scan { flex: none; height: 40px; padding: 0 16px 0 14px; gap: 9px; border-radius: 9px; font-weight: 600; letter-spacing: .01em;
    color: #f4f4f2; border: 1px solid #0d0d0d; background: linear-gradient(#3d3d3d, #222);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 2px 10px rgba(0,0,0,.22); }
  #scan:hover { background: linear-gradient(#474747, #2a2a2a); }
  #scan:active { background: linear-gradient(#262626, #303030); box-shadow: inset 0 1px 2px rgba(0,0,0,.4); }
  #scan .ic { width: 17px; height: 17px; color: #f5a524; }
  #poly { flex: none; padding: 0 12px; background: var(--panel); }
  #poly:hover { background: linear-gradient(rgba(127,127,127,.12), rgba(127,127,127,.12)), var(--panel); }
  #poly.busy .ic { animation: spin 1.4s linear infinite; }
  #poly[hidden] { display: none; }
  #scan .ver { font-weight: 500; font-size: 11px; color: #bdbdb8; padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.09); }
  #scan.busy .ic { animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #scaninfo { display: flex; align-items: center; gap: 7px; padding-right: 4px; color: var(--muted); text-shadow: 0 0 4px var(--bg); }
  #scaninfo .dot { color: var(--warn); }
  #scaninfo.bad .dot { color: var(--bad); }
  #scaninfo[hidden] { display: none; }
  /* the last scan: what it found */
  #last { width: 220px; text-align: right; color: var(--muted); text-shadow: 0 0 4px var(--bg); }
  #last[hidden] { display: none; }
  #lasttext { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 600px) { .scan { top: auto; bottom: 12px; } }
  .pop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(0,0,0,.45); }
  .pop[hidden] { display: none; }
  .popbox { width: min(380px, calc(100vw - 32px)); background: var(--panel, #fff); color: var(--ink, #111); border-radius: 12px;
    padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  .popbox b { font-size: 16px; }
  .bar { height: 8px; border-radius: 4px; background: rgba(127,127,127,.25); overflow: hidden; }
  #calbar { height: 100%; width: 0; background: #f5a524; transition: width .3s; }
  #caltext { font-size: 12px; line-height: 1.5; white-space: pre-wrap; }
  .popbtns { display: flex; justify-content: flex-end; gap: 8px; }
  .popbtns button[hidden] { display: none; }
  #msg { color: var(--muted); }
  #msg:empty { display: none; }
</style>
</head>
<body>
<div id="calpop" class="pop" hidden>
  <div class="popbox">
    <b id="caltitle">Calibrating</b>
    <div class="bar"><div id="calbar"></div></div>
    <div id="caltext" class="mono"></div>
    <div class="popbtns"><button id="calpopstop" class="stop">Stop calibrating</button><button id="calpopok" hidden>OK</button></div>
  </div>
</div>
<div id="view"></div>

<div class="hud">
  <div class="top"><b>3D SCENE</b><span id="conn" class="dot bad" title="offline"></span><span class="links"><a href="/">Home</a><a href="/jog">Jog</a><a href="/vision">Vision</a><a href="/talk">Talk</a></span></div>
  <div class="rows">
    <div class="row"><span>Head</span><span id="head" class="mono">–</span></div>
    <div class="row"><span>Mate</span><span id="mate" class="mono">–</span></div>
    <div class="row"><span>Cards</span><span id="cards" class="mono">–</span></div>
  </div>
  <div class="grid2"><button id="top"><svg class="ic " viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18"/><path d="M12 3v18"/></svg>Top</button><button id="side"><svg class="ic " viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>Side</button></div>
  <div id="msg"></div>
  <button id="calbtn" class="fold"><svg class="ic " viewBox="0 0 24 24"><path d="M21 4h-7"/><path d="M10 4H3"/><path d="M21 12h-9"/><path d="M8 12H3"/><path d="M21 20h-5"/><path d="M12 20H3"/><path d="M14 2v4"/><path d="M8 10v4"/><path d="M16 18v4"/></svg><span>Calibration</span><span id="calstat" class="state"></span><svg class="ic chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
  <div id="calbox" hidden>
    <div class="rows">
      <div class="row"><span>Calibrated</span><span id="cal" class="mono">–</span></div>
      <div class="row"><span>Head check (camera)</span><span id="herr" class="mono">–</span></div>
      <div class="row"><span>Camera moved</span><span id="moved" class="mono">–</span></div>
      <div class="row"><span>Board markers</span><span id="board" class="mono">–</span></div>
      <div class="row"><span>Board height</span><span id="tz" class="mono">–</span></div>
      <div class="row"><span>Travel height</span><span id="travel" class="mono">–</span></div>
    </div>
    <div class="grid2">
      <button id="calib"><svg class="ic " viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 1v4"/><path d="M12 19v4"/><path d="M1 12h4"/><path d="M19 12h4"/></svg>Calibrate</button><button id="reanchor"><svg class="ic " viewBox="0 0 24 24"><path d="M12 22V8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/><circle cx="12" cy="5" r="3"/></svg>Re-anchor</button><button id="calstop" hidden class="stop">Stop calibrating</button>
      <button id="travelset"><svg class="ic " viewBox="0 0 24 24"><path d="M5 3h14"/><path d="m18 13-6-6-6 6"/><path d="M12 7v14"/></svg>Travel here</button>
    
      <button id="matehome" title="Mate is where its home should be: save that spot and heading">Mate home here</button>
    </div>
  </div>
</div>

<div class="scan">
  <button id="scan"><svg class="ic" viewBox="0 0 24 24"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/></svg>Scan with SAM<span class="ver">3.1</span></button>
  <div id="scaninfo" hidden><span class="dot"></span><span id="scanmsg"></span></div>
  <div id="last" hidden><div id="lasttext"></div></div>
  <button id="poly" hidden><svg class="ic" viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>Render poly</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = id => document.getElementById(id);
const CARD = [63, 88], BOARD_MARKER = 30;
// Mate: a 130 x 130 x 100 plywood box, 3 mm off the ground on its wheels, black printed corner caps that
// stand 2 mm proud of every face (so 105 to the top of the caps); the marker is on the plywood top (103)
const MATE = { w: 130, d: 130, body: 100, lift: 3, proud: 2, corner: 24 };
// Flipper: a black plastic knife on a servo on the right side, 42 mm from the right wheel's axle at
// 45 deg (forward and up). The shaft points straight out of the side, so the blade swings in a plane
// beside the box: out 73 mm, then bent 90 deg inward across the whole front of the face. 20 deg (rest): the
// arm angles down and the bent part lies on the table; 65 deg: the arm points straight forward and the
// bent part stands flat, parallel to and centred on the face; past that it rises over the top.
const FLIP = { fromAxle: 42, at: 45, seg1: 73, seg2: 146, width: 14, rest: 20, level: 65 };
const WHEEL_FORWARD = 5;   // the axle is 5 mm ahead of the box's middle
// The head, relative to the head marker's centre (what GRBL positions). The cup tip lands at
// (-2.4, -19.7) and 57 mm below (vision.TIP_OFFSET / TIP_BELOW_MARKER: measured where it lands, in
// vision's frame). The build, as it is: the gripper is bolted to the 2020 Z extrusion's front face
// (-Y, toward the person at the table), in line with the bar, cup straight down; the marker card is
// glued to the bar's left face (-X, facing cam 1), ~1 mm out. Draw it like that, anchored on the cup:
// the bar is in line with the cup and the card on its left face, even though that puts the drawn card
// ~11 mm left of where vision puts the marker (TIP's X is a landing fix, not a ruler measurement).
const TIP = { dx: -2.4, dy: -19.7, dz: -57 }, EXT_RIGHT = 10 + 1 + .5;
const PLATE = [38, 64, .5], HEAD_MARKER = 25, HEAD_MARKER_CUT = 33; // card thickness approximated for display
const WHEEL = { d: 70, w: 8 };

// Gantry: X right, Y away, Z+ up (mm; $3 inverts the Z motor). three.js: y up. So (X, Y, Z) -> (X, Z, -Y).
const P = (x, y, z) => new THREE.Vector3(x, z, -y);

// ---- scene ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
$('view').append(renderer.domElement);
const scene = new THREE.Scene();
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
scene.background = new THREE.Color(dark ? 0x0e0e0e : 0xf4f4f2);
const camera = new THREE.PerspectiveCamera(45, 1, 1, 20000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(300, 800, 400); scene.add(sun);

const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: .8 });
const group = name => { const g = new THREE.Group(); g.name = name; scene.add(g); return g; };
const boardG = group('board'), itemsG = group('items'), cardsG = group('cards'), chipsG = group('chips'), decksG = group('decks'), mateG = group('mate'), camsG = group('cams'), boundsG = group('bounds'), homeG = group('home');

// head: built around the head marker's centre (the group's origin), from measured offsets
const L = (dx, dy, dz) => new THREE.Vector3(dx, dz, -dy);           // gantry offset -> three offset
const head = new THREE.Group(); head.visible = false; scene.add(head);
const metal = mat(0xb8bcc2), steel = mat(0x8d9096), dark2 = mat(0x2a2a2a);
const tipL = L(TIP.dx, TIP.dy, TIP.dz);
// 2020 Z extrusion with its four slots
const railG = new THREE.Group(); head.add(railG);
railG.add(new THREE.Mesh(new THREE.BoxGeometry(20, 320, 20), metal));
for (const [sx, sz] of [[10, 0], [-10, 0], [0, 10], [0, -10]]) {
  const slot = new THREE.Mesh(new THREE.BoxGeometry(sx ? 1 : 6, 320, sz ? 1 : 6), dark2);
  slot.position.set(sx, 0, sz); railG.add(slot);
}
// marker card, upright on the extrusion's left face
const plateG = new THREE.Group(); head.add(plateG);
plateG.add(new THREE.Mesh(new THREE.BoxGeometry(PLATE[0], PLATE[1], PLATE[2]), mat(0xe8e2d6)));
const paper = new THREE.Mesh(new THREE.PlaneGeometry(HEAD_MARKER_CUT, HEAD_MARKER_CUT), mat(0xffffff));
paper.position.z = PLATE[2] / 2 + .2; plateG.add(paper);
const ink = new THREE.Mesh(new THREE.PlaneGeometry(HEAD_MARKER, HEAD_MARKER), mat(0x111111));
ink.position.z = PLATE[2] / 2 + .4; plateG.add(ink);
// The gripper is bolted to the extrusion's front face (-Y, toward the person at the table) and
// runs parallel to it, straight down: a bracket straight out of that face to the stem, then nut,
// threaded stem, spring, bellows cup. Nothing is angled.
const bracketY = TIP.dz + 34;
const ext = L(TIP.dx, 0, 0);                                      // extrusion centre: in line with the cup
railG.position.set(ext.x, -30 + 160, ext.z);
const front = L(0, -10, 0).z;                                      // the front face
const bracket = new THREE.Mesh(new THREE.BoxGeometry(14, 5, tipL.z - front + 7), mat(0x3a3a3a)); head.add(bracket);
bracket.position.set(tipL.x, bracketY, (front + tipL.z + 7) / 2);
plateG.rotation.y = -Math.PI / 2;                                  // left face (-X), facing left
plateG.position.set(ext.x - EXT_RIGHT - 1, 0, 0);                 // on the left face; 1 mm further out so it doesn't flicker
const nut = new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 5, 6), steel); nut.position.set(tipL.x, bracketY + 5, tipL.z); head.add(nut);
const stem = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 40, 12), steel);
stem.position.set(tipL.x, bracketY - 8, tipL.z); head.add(stem);
for (let i = 0; i < 6; i++) {
  const coil = new THREE.Mesh(new THREE.TorusGeometry(4.5, .7, 6, 18), steel);
  coil.rotation.x = Math.PI / 2; coil.position.set(tipL.x, bracketY - 6 - i * 2.4, tipL.z); head.add(coil);
}
const glass = new THREE.MeshStandardMaterial({ color: 0xbfe6ff, transparent: true, opacity: .7, roughness: .2 });
for (const [r, y] of [[7.5, TIP.dz + 2], [6, TIP.dz + 6], [7.5, TIP.dz + 10], [5, TIP.dz + 14]]) {   // 15 mm cup
  const fold = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 4, 20), glass);    // 2-layer bellows
  fold.position.set(tipL.x, y, tipL.z); head.add(fold);
}
const tubeMat = new THREE.MeshStandardMaterial({ color: 0xdff3ff, transparent: true, opacity: .55 });
const tube = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 260, 10), tubeMat);
tube.position.set(tipL.x, bracketY + 130, tipL.z); head.add(tube);
// error ring on the board under the tip
const ring = new THREE.Mesh(new THREE.TorusGeometry(14, 2, 8, 32), new THREE.MeshBasicMaterial({ color: 0x888888 }));
ring.rotation.x = Math.PI / 2; scene.add(ring); ring.visible = false;

let table = null, lastTableZ = null, framed = false;
function drawTable(tz, markers) {
  boardG.clear();
  const pts = Object.values(markers || {});
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const [x0, x1, y0, y1] = pts.length >= 2 ? [Math.min(...xs) - 80, Math.max(...xs) + 80, Math.min(...ys) - 80, Math.max(...ys) + 80]
                                          : [-300, 300, -300, 300];
  const board = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, 2, y1 - y0), mat(0x1b1b1b));
  board.position.copy(P((x0 + x1) / 2, (y0 + y1) / 2, tz - 1)); boardG.add(board);
  const grid = new THREE.GridHelper(2000, 40, 0x888888, dark ? 0x2a2a2a : 0xdddddd);
  grid.position.copy(P((x0 + x1) / 2, (y0 + y1) / 2, tz - 2.5)); boardG.add(grid);
  for (const [id, m] of Object.entries(markers || {})) {
    const w = new THREE.Mesh(new THREE.BoxGeometry(BOARD_MARKER + 12, 1, BOARD_MARKER + 12), mat(0xffffff));
    w.position.copy(P(m.x, m.y, tz + .5)); boardG.add(w);
    const k = new THREE.Mesh(new THREE.BoxGeometry(BOARD_MARKER, 1.2, BOARD_MARKER), mat(0x111111));
    k.position.copy(P(m.x, m.y, tz + .7)); boardG.add(k);
  }
  table = { tz, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, size: Math.max(x1 - x0, y1 - y0) };
}

function drawHead(h, tz) {
  if (!h) return;
  head.visible = ring.visible = true;
  head.position.copy(P(h.x, h.y, h.z));
  ring.position.copy(P(h.x + TIP.dx, h.y + TIP.dy, tz + 1));
  const e = h.error_mm;
  ring.material.color.set(e == null ? 0x888888 : e < 2 ? 0x22c55e : e < 5 ? 0xeab308 : 0xef4444);
}

// Each detection carries a little pixel noise; only redraw what moved more than this, so the
// view holds still while the table does.
const STILL_MM = 2, STILL_DEG = 3;
const angDiff = (a, b, period) => { const d = (((a - b) % period) + period) % period; return Math.min(d, period - d); };
let shownCards = null, shownMate = null;
function cardsMoved(next) {
  if (!shownCards || shownCards.length !== next.length) return true;
  return next.some(c => !shownCards.some(o => o.face === c.face && o.card === c.card && Math.hypot(o.x - c.x, o.y - c.y) < STILL_MM
                                                && angDiff(o.angle, c.angle, 180) < STILL_DEG));
}
function mateMoved(m) {
  if (!m || !shownMate) return m !== shownMate;
  return Math.hypot(m.x - shownMate.x, m.y - shownMate.y) >= STILL_MM || angDiff(m.heading, shownMate.heading, 360) >= STILL_DEG
    || m.flipper !== shownMate.flipper;
}

// where the cup may go: the rectangle inside the board markers
let shownBounds = null;
function drawBounds(b, tz) {
  const key = b ? b.join(',') + '@' + tz : null;
  if (key === shownBounds) return;
  shownBounds = key; boundsG.clear();
  if (!b) return;
  const [x0, x1, y0, y1] = b;
  const pts = [[x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, y0]].map(([x, y]) => P(x, y, tz + 1.5));
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineDashedMaterial({ color: 0xea580c, dashSize: 12, gapSize: 8 }));
  line.computeLineDistances(); boundsG.add(line);
}

// Mate's home: its footprint outline and a facing tick, where /api/mate/home parks it
let shownHome = null;
function drawHome(h, tz) {
  const key = h ? h.join(',') + '@' + tz : null;
  if (key === shownHome) return;
  shownHome = key; homeG.clear();
  if (!h) return;
  const [x, y, hd] = h, a = hd * Math.PI / 180, r = 67;
  const at = (fx, fy) => P(x + fx * Math.cos(a) - fy * Math.sin(a), y + fx * Math.sin(a) + fy * Math.cos(a), tz + 1.5);
  const sq = [[-r, -r], [r, -r], [r, r], [-r, r], [-r, -r]].map(([u, v]) => at(u, v));
  const mat2 = new THREE.LineDashedMaterial({ color: 0x22c55e, dashSize: 8, gapSize: 6 });
  const box = new THREE.Line(new THREE.BufferGeometry().setFromPoints(sq), mat2); box.computeLineDistances(); homeG.add(box);
  const tick = new THREE.Line(new THREE.BufferGeometry().setFromPoints([at(0, 0), at(r + 25, 0)]), new THREE.LineBasicMaterial({ color: 0x22c55e }));
  homeG.add(tick);
}

function drawCards(cards, tz) {
  cardsG.clear();
  for (const c of cards || []) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(CARD[1], 1, CARD[0]), mat(c.face === 'down' ? 0x2848a8 : 0xf5f5f0));
    m.position.copy(P(c.x, c.y, tz + .6));
    m.rotation.y = c.angle * Math.PI / 180;           // long side along the card's angle
    cardsG.add(m);
    if (c.card) {                                     // named (the card cache or Muse): its name on its face
      const t = topText(c.card, CARD[0], CARD[1]);
      Object.assign(t.material, { polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });   // always drawn over the card
      t.position.copy(P(c.x, c.y, tz + 1.6)); t.rotation.z = c.angle * Math.PI / 180 - Math.PI / 2;   // reads from the front
      cardsG.add(t);
    }
  }
}

// chip stacks (scene.chips, from cam 1's colours): one disc per chip, where the stack really stands
const CHIP = { d: 40, t: 3.3 }, CHIP_COLOR = { red: 0xc62828, white: 0xf0f0ea, mixed: 0xd08080 };
let shownChips = '';
function drawChips(chips, tz) {
  const key = JSON.stringify((chips || []).map(c => [Math.round(c.x / STILL_MM), Math.round(c.y / STILL_MM), c.count, c.count_raw, c.colour]));
  if (key === shownChips) return;
  shownChips = key; chipsG.clear();
  for (const c of chips || []) {
    for (let k = 0; k < c.count; k++) {
      const disc = new THREE.Mesh(new THREE.CylinderGeometry(CHIP.d / 2, CHIP.d / 2, CHIP.t * .9, 32), mat(CHIP_COLOR[c.colour] ?? 0xcccccc));
      disc.position.copy(P(c.x, c.y, tz + CHIP.t * (k + .5))); chipsG.add(disc);
    }
    const label = makeLabel(c.count_raw != null ? `×${c.count_raw.toFixed(1)}` : `×${c.count}`, CHIP_COLOR[c.colour] ?? 0xcccccc);
    label.position.copy(P(c.x, c.y, tz + CHIP.t * c.count + 16)); chipsG.add(label);
  }
}

// decks (scene.decks): a box of their real height, back up
let shownDecks = '';
function drawDecks(decks, tz) {
  const key = JSON.stringify((decks || []).map(d => [Math.round(d.x / STILL_MM), Math.round(d.y / STILL_MM), Math.round(d.angle / STILL_DEG), d.cards]));
  if (key === shownDecks) return;
  shownDecks = key; decksG.clear();
  for (const d of decks || []) {
    const box = new THREE.Mesh(new THREE.BoxGeometry(CARD[1], d.height_mm, CARD[0]),
      [0xf5f5f0, 0xf5f5f0, 0x2848a8, 0xf5f5f0, 0xf5f5f0, 0xf5f5f0].map(mat));   // white edges, blue back on top
    box.position.copy(P(d.x, d.y, tz + d.height_mm / 2)); box.rotation.y = d.angle * Math.PI / 180; decksG.add(box);
    const label = makeLabel(`deck ~${d.cards}`, 0x7aa2ff);
    label.position.copy(P(d.x, d.y, tz + d.height_mm + 16)); decksG.add(label);
  }
}

function drawMate(m, tz) {
  mateG.clear();
  if (!m) return;
  const { w: W, d: D, body: B, lift, proud, corner: C } = MATE;   // local +x = forward (the face), z = sideways
  const h = lift + B;                                 // the plywood top, where the marker is
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(W, B, D), mat(0xd9b98a));
  body.position.y = lift + B / 2; g.add(body);
  // corner caps wrap each corner and stand `proud` mm out of every face they touch
  for (const sx of [-1, 1]) for (const top of [0, 1]) for (const sz of [-1, 1]) {
    const k = new THREE.Mesh(new THREE.BoxGeometry(C, C, C), mat(0x1c1c1c));
    k.position.set(sx * (W / 2 + proud - C / 2), top ? h + proud - C / 2 : lift - proud + C / 2, sz * (D / 2 + proud - C / 2));
    g.add(k);
  }
  for (const sz of [-1, 1]) {                         // wheels: black hub, red rim, on each side
    const wheel = new THREE.Group();
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(WHEEL.d / 2 - 4, WHEEL.d / 2 - 4, WHEEL.w, 32), mat(0x151515));
    const rim = new THREE.Mesh(new THREE.TorusGeometry(WHEEL.d / 2 - 2.5, 3, 12, 40), mat(0xd62828));
    rim.rotation.x = Math.PI / 2;
    wheel.add(hub, rim);
    for (let i = 0; i < 6; i++) {                     // lightening holes
      const a = i * Math.PI / 3, hole = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, WHEEL.w + .5, 12), mat(0x3a3a3a));
      hole.position.set(Math.cos(a) * 17, 0, Math.sin(a) * 17); wheel.add(hole);
    }
    wheel.rotation.x = Math.PI / 2;
    wheel.position.set(WHEEL_FORWARD, WHEEL.d / 2, sz * (D / 2 + proud + WHEEL.w / 2 + 1));
    g.add(wheel);
  }
  // flipper: the shaft points out of the right side (+z), the arm swings in the x-y plane beside it
  const flip = new THREE.Group();
  const fa = FLIP.at * Math.PI / 180;
  const pivotY = WHEEL.d / 2 + FLIP.fromAxle * Math.sin(fa);
  flip.position.set(WHEEL_FORWARD + FLIP.fromAxle * Math.cos(fa), pivotY, D / 2 + proud + 6);
  const horn = new THREE.Mesh(new THREE.CylinderGeometry(6, 6, 6, 16), mat(0x2b2b2b));
  horn.rotation.x = Math.PI / 2; horn.position.z = -3; flip.add(horn);
  // phi: the arm's angle from straight forward (+ = up); level at FLIP.level, down on the table at FLIP.rest
  const restPhi = -Math.asin(Math.min(1, (pivotY - 5) / FLIP.seg1));
  const phi = ((m.flipper ?? FLIP.rest) - FLIP.level) / (FLIP.level - FLIP.rest) * -restPhi;
  const arm = new THREE.Group(); arm.rotation.z = phi; flip.add(arm);
  const k = mat(0x101010);
  const s1 = new THREE.Mesh(new THREE.BoxGeometry(FLIP.seg1, FLIP.width, 2.5), k);   // flat side faces out
  s1.position.x = FLIP.seg1 / 2; arm.add(s1);
  const s2 = new THREE.Mesh(new THREE.BoxGeometry(2.5, FLIP.width, FLIP.seg2), k);   // bent inward, flat side faces forward
  s2.position.set(FLIP.seg1, 0, -FLIP.seg2 / 2 + 1.25); arm.add(s2);
  g.add(flip);
  const face = new THREE.Mesh(new THREE.BoxGeometry(3, 16, 28), mat(0x111111));    // OLED
  face.position.set(W / 2 + 1.5, lift + B * .62, 0); g.add(face);
  const eye = new THREE.MeshBasicMaterial({ color: 0x7fd8ff });
  for (const sz of [-6, 6]) { const e = new THREE.Mesh(new THREE.BoxGeometry(1, 3, 5), eye); e.position.set(W / 2 + 3.2, lift + B * .64, sz); g.add(e); }
  const top = new THREE.Mesh(new THREE.BoxGeometry(40, 1, 40), mat(0xffffff)); top.position.set(0, h + .5, 0); g.add(top);
  const topInk = new THREE.Mesh(new THREE.BoxGeometry(30, 1.2, 30), mat(0x111111)); topInk.position.set(0, h + .7, 0); g.add(topInk);
  const arrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, h + proud + 4, 0), 80, 0xea580c, 18, 12); g.add(arrow);
  g.position.copy(P(m.x, m.y, tz));
  g.rotation.y = m.heading * Math.PI / 180;          // gantry heading (from +X toward +Y) -> three's y rotation
  mateG.add(g);
}

// camera modules, posed from calibration: board, lens, and the picture's footprint on the table
const G = v => new THREE.Vector3(v[0], v[2], -v[1]);        // gantry direction -> three direction
let shownCams = null;
function drawCams(cams, tz) {
  const key = JSON.stringify(Object.entries(cams || {}).map(([k, c]) => [k, c.position.map(Math.round)]));
  if (key === shownCams) return;
  shownCams = key; camsG.clear();
  for (const [id, c] of Object.entries(cams || {})) {
    if (!c.forward) continue;
    const pos = P(...c.position);
    const back = G(c.forward).negate().normalize();           // three cameras look down -z
    const right = G(c.up).cross(back).normalize();
    const up = back.clone().cross(right).normalize();
    const mod = new THREE.Group();
    mod.matrix.makeBasis(right, up, back).scale(new THREE.Vector3(2.5, 2.5, 2.5)).setPosition(pos);   // 2.5x real size, to be seen
    mod.matrixAutoUpdate = false;
    const pcb = new THREE.Mesh(new THREE.BoxGeometry(25, 24, 1.6), mat(0x1f7a3a));     // Camera v2-sized board
    pcb.position.z = 2; mod.add(pcb);
    const holder = new THREE.Mesh(new THREE.BoxGeometry(8.5, 8.5, 4.5), mat(0x161616)); // lens holder
    holder.position.z = -1; mod.add(holder);
    const lens = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 3, 20), mat(0x0b0b0b));
    lens.rotation.x = Math.PI / 2; lens.position.z = -4.5; mod.add(lens);
    const glass = new THREE.Mesh(new THREE.CircleGeometry(2.2, 20), new THREE.MeshStandardMaterial({ color: 0x3355aa, roughness: .1, metalness: .6 }));
    glass.position.z = -6.05; glass.rotation.y = Math.PI; mod.add(glass);
    const ribbon = new THREE.Mesh(new THREE.BoxGeometry(16, 30, .4), mat(0xd9d2c0));    // ribbon cable
    ribbon.position.set(0, -26, 2.9); mod.add(ribbon);
    camsG.add(mod);
    // footprint: where the picture's corners meet the board
    const hit = c.rays.map(r => {
      const d = G(r), t = (tz - c.position[2]) / r[2];
      return t > 0 ? pos.clone().add(d.multiplyScalar(t)) : null;
    });
    const color = id === '1' ? 0x6366f1 : 0x0ea5e9;
    const dashed = new THREE.LineDashedMaterial({ color, dashSize: 10, gapSize: 8, transparent: true, opacity: .8 });
    for (const h of hit) if (h) {
      const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([pos, h]), dashed);
      l.computeLineDistances(); camsG.add(l);
    }
    if (hit.every(Boolean)) {
      const edge = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(hit.map(h => h.clone().setY(tz + 1))),
        new THREE.LineBasicMaterial({ color }));
      camsG.add(edge);
    }
    const label = makeLabel(`cam ${id} · ${c.model || ''}`, color);
    label.position.copy(pos).add(new THREE.Vector3(0, 55, 0)); camsG.add(label);
  }
}

function makeLabel(text, color) {
  // as wide as its text (up to LABEL_MAX characters, then …), 22 mm tall
  const LABEL_MAX = 28, font = 'bold 30px -apple-system, sans-serif';
  text = String(text).trim();
  if (text.length > LABEL_MAX) text = text.slice(0, LABEL_MAX - 1) + '…';
  const cv = document.createElement('canvas'), g = cv.getContext('2d');
  g.font = font;
  cv.width = Math.ceil(g.measureText(text).width) + 28; cv.height = 64;
  g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, 0, cv.width, 64);
  g.fillStyle = '#' + color.toString(16).padStart(6, '0'); g.font = font;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, cv.width / 2, 33);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false }));
  sp.scale.set(22 * cv.width / 64, 22, 1);
  return sp;
}

// Muse's answer as a label: JSON like {"card": "5♣", "confidence": 0.95} becomes "5♣ 0.95"
function answerText(a) {
  try {
    const j = JSON.parse(String(a).slice(String(a).indexOf('{'), String(a).lastIndexOf('}') + 1));
    const main = Object.entries(j).filter(([k]) => k !== 'confidence').map(([, v]) => v).join(' ');
    return j.confidence != null ? `${main} ${(+j.confidence).toFixed(2)}` : main;
  } catch { return a; }
}

function frameView(top) {
  if (!table) return;
  const c = P(table.cx, table.cy, table.tz);
  controls.target.copy(c);
  const d = table.size * 1.8;                         // wide enough to include the cameras
  camera.position.copy(top ? c.clone().add(new THREE.Vector3(0, d * 1.2, 1)) : c.clone().add(new THREE.Vector3(0, d * .7, d)));
  controls.update();
}
function setCal(open) { $('calbox').hidden = !open; $('calbtn').classList.toggle('open', open); }
$('calbtn').onclick = () => setCal($('calbox').hidden);
$('top').onclick = () => frameView(true);
$('side').onclick = () => frameView(false);

// ---- data ----
let S = null;
function render(s) {
  S = s;
  const fmt = v => v == null ? '–' : v.toFixed(1);
  $('cal').textContent = s.calibrated ? 'yes' : 'not yet';
  $('cal').className = 'mono ' + (s.calibrated ? 'ok' : 'warn');
  if (!s.calibrated) {
    $('msg').textContent = 'Not calibrated. Park the head over the middle of the board with the cup a few cm up, then press Calibrate.';
    setCal(true); $('calstat').innerHTML = 'not yet<span class="dot warn"></span>';
    return;
  }
  const tz = s.table_z ?? 0;
  if (tz !== lastTableZ || !table || Object.keys(s.board || {}).length !== table.n) {
    drawTable(tz, s.board); table.n = Object.keys(s.board || {}).length; lastTableZ = tz;
  }
  drawHead(s.head, tz); drawCams(s.cameras, tz); drawBounds(s.bounds, tz); drawHome(s.mate_home, tz);
  if (cardsMoved(s.cards || [])) { drawCards(s.cards, tz); shownCards = s.cards || []; }
  drawChips(s.chips, tz);
  drawDecks(s.decks, tz);
  if (mateMoved(s.mate)) { drawMate(s.mate, tz); shownMate = s.mate; }
  if (!framed) { frameView(false); framed = true; }
  const h = s.head || {};
  $('head').textContent = `${fmt(h.x)}, ${fmt(h.y)}, ${fmt(h.z)}`;
  const e = h.error_mm;
  $('herr').textContent = e == null ? 'not seen' : e.toFixed(1) + ' mm';
  $('herr').className = 'mono ' + (e == null ? '' : e < 2 ? 'ok' : e < 5 ? 'warn' : 'bad');
  const mv = s.camera_moved_px;
  $('moved').textContent = mv == null ? '–' : mv < 3 ? 'no' : `${mv.toFixed(0)} px: recalibrate or re-measure bounds`;
  $('moved').className = 'mono ' + (mv == null || mv < 3 ? '' : 'warn');
  $('mate').textContent = s.mate ? `${fmt(s.mate.x)}, ${fmt(s.mate.y)} · ${s.mate.heading.toFixed(0)}°` : 'not seen';
  const cards = s.cards || [];
  $('cards').textContent = cards.length ? `${cards.length} (${cards.filter(c => c.face === 'up').length} up)` : 'none';
  $('board').textContent = Object.keys(s.board || {}).sort().join(', ') || 'none';
  $('tz').textContent = s.table_z == null ? 'unknown' : `Z ${s.table_z.toFixed(1)} · ${s.table_source === 'touch' ? 'touched' : 'estimated'}`;
  $('tz').className = 'mono ' + (s.table_source === 'touch' ? 'ok' : 'warn');
  $('travel').textContent = s.travel_z == null ? 'not set' : `Z ${s.travel_z.toFixed(1)}`;
  $('reanchor').style.borderColor = s.needs_reanchor ? 'var(--warn)' : '';
  const calOk = !s.needs_reanchor && !(mv >= 3) && s.table_source === 'touch';
  const why = s.needs_reanchor ? 're-anchor' : mv >= 3 ? 'camera moved' : s.table_source !== 'touch' ? 'board not touched' : '';
  $('calstat').innerHTML = `${why}<span class="dot ${calOk ? 'ok' : 'warn'}" title="${calOk ? 'all good' : why}"></span>`;
  if (!calOk && !$('calbox').dataset.seen) { setCal(true); $('calbox').dataset.seen = 1; }
  if (s.needs_reanchor && !$('msg').dataset.keep) say('GRBL was reset: unlock it, then press Re-anchor before trusting positions.');
  if (!$('msg').dataset.keep && !s.needs_reanchor) $('msg').textContent = '';
}

function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => { $('conn').className = 'dot ok'; $('conn').title = 'connected'; };
  ws.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'scene') render(ev);
    else if (ev.type === 'calibrate') calProgress(ev);
    else if (ev.type === 'vision' && ev.kind === 'find' && ev.by !== 'scene' && ev.items.some(i => i.board)) drawItems(ev);   // others' finds too (not Mate's: no board places)
    else if (ev.type === 'vision' && ev.kind === 'shape' && ev.by !== 'scene') drawPolys(ev);
    else if (ev.type === 'status' && S && S.calibrated && ev.WPos) {     // move the head between scene updates
      S.head = { ...S.head, x: ev.WPos[0], y: ev.WPos[1], z: ev.WPos[2], tip_z: ev.WPos[2] + TIP.dz };
      drawHead(S.head, S.table_z ?? 0);
      $('head').textContent = ev.WPos.map(v => v.toFixed(1)).join(', ');
    }
  };
  ws.onclose = () => { $('conn').className = 'dot bad'; $('conn').title = 'offline'; setTimeout(connect, 1500); };
  setInterval(() => ws.readyState === 1 && ws.send('ping'), 10000);
}

async function post(path, body) {
  const r = await fetch('/api/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined });
  return r.json();
}
function say(text, keep) { $('msg').textContent = text; if (keep) $('msg').dataset.keep = 1; else delete $('msg').dataset.keep; }

$('calib').onclick = async () => {
  // start from Work zero with the cup touching the board in the middle: that's the board's height and the grid's middle
  const h = S?.head || {};
  if (![h.x, h.y, h.z].every(v => Math.abs(v ?? 1) < 0.05)) {
    say('To calibrate: on the jog page, bring the cup down until it just touches the board in the middle, Work zero X, Y and Z there, then press Calibrate. (The head is at ' + [h.x, h.y, h.z].map(v => (v ?? 0).toFixed(1)).join(', ') + '.)', true);
    return;
  }
  const top = S?.travel_z ?? 110;
  if (!confirm(`Calibrate: the cup rises to ${top.toFixed(0)} mm, then visits 5 × 5 spots 110 mm each way from here at ${top.toFixed(0)}, ${((top + 15) / 2).toFixed(0)} and 15 mm above the board, then measures the board markers. Keep the board clear (nothing taller than ~10 mm) and Mate at home or off the board. About 3 minutes.`)) return;
  $('calib').disabled = $('reanchor').disabled = true;
  $('calstop').hidden = false;
  say('Calibrating…', true);
  calOpen();
  try {
    const r = await post('calibrate', { from_zero: true, span: 110, steps: 5, levels: 3 });
    if (!r.ok) { say('Calibration failed: ' + r.error, true); calDone('Calibration failed', r.error); }
    else {
      const cams = Object.entries(r.cams).map(([k, c]) => c.rms_px != null ? `cam ${k}: ${c.seen}/${c.of} stops, ${c.rms_px.toFixed(2)} px` : `cam ${k}: ${c.error}`);
      const b = r.bounds_measured;
      const board = b?.ok ? `board X ${b.bounds.x.join(' to ')}, Y ${b.bounds.y.join(' to ')}` : `board markers: ${b?.error || 'not measured'}`;
      say('Calibrated. ' + cams.join(' · ') + ' · ' + board, true);
      calDone('Calibrated', cams.join('\n') + '\n' + board);
      framed = false;
    }
  } catch (e) { say('Calibration failed: ' + e.message, true); calDone('Calibration failed', e.message); }
  $('calib').disabled = $('reanchor').disabled = false;
  $('calstop').hidden = true;
};
// the calibration popup: open while it runs (here or started elsewhere), the result when it ends
function calOpen() {
  $('calpop').hidden = false; $('caltitle').textContent = 'Calibrating';
  $('calbar').style.width = '0'; $('caltext').textContent = 'Starting: keep the board clear and hands off.';
  $('calpopstop').hidden = false; $('calpopok').hidden = true;
}
function calProgress(ev) {
  if ($('calpop').hidden || !$('calpopok').hidden) calOpen();
  $('calbar').style.width = (100 * ev.stop / ev.of).toFixed(0) + '%';
  const seen = Object.entries(ev.seen || {}).map(([k, n]) => `cam ${k} saw the head ${n}×`).join(' · ');
  $('caltext').textContent = `Stop ${ev.stop} of ${ev.of}` + (seen ? `\n${seen}` : '');
}
function calDone(title, text) {
  $('calpop').hidden = false; $('caltitle').textContent = title; $('caltext').textContent = text;
  $('calbar').style.width = '100%'; $('calpopstop').hidden = true; $('calpopok').hidden = false;
}
$('calpopok').onclick = () => { $('calpop').hidden = true; };
$('calpopstop').onclick = () => { post('calibrate/stop'); $('caltext').textContent = 'Stopping after this move…'; };
$('calstop').onclick = () => { post('calibrate/stop'); say('Stopping after this move…', true); };
$('travelset').onclick = async () => {
  if (!confirm('Use the current Z as the travel height? Below it, the head is kept off Mate.')) return;
  const r = await post('calibration/travel');
  say(r.ok ? `Travel height set: Z ${r.travel_z.toFixed(1)}` : 'Failed: ' + r.error, true);
};
$('reanchor').onclick = async () => {
  let r = await post('calibration/reanchor');
  if (r.ok && r.camera_off_mm > 10 && confirm(`The cameras see the head ${r.camera_off_mm.toFixed(0)} mm from the saved position: it may have skipped steps. Take X and Y from the cameras instead?`)) {
    r = await post('calibration/reanchor?camera=true');
    say(r.ok ? `Re-anchored from the cameras: ${r.x.toFixed(1)}, ${r.y.toFixed(1)}, Z ${r.z.toFixed(1)}` +
               (r.camera_z == null ? '' : ` (cameras put Z at ${r.camera_z.toFixed(1)})`) : 'Re-anchor failed: ' + (r.error || r.reply), true);
    return;
  }
  say(r.ok ? `Re-anchored to the saved position ${r.x.toFixed(1)}, ${r.y.toFixed(1)}, ${r.z.toFixed(1)}` +
             (r.camera_off_mm == null ? '' : ` (camera sees it ${r.camera_off_mm.toFixed(1)} mm away)`)
           : 'Re-anchor failed: ' + (r.error || r.reply), true);
};

// ---- scan items: what the eyes found (/api/see, /api/find), as ghosts at half strength until rendered ----
const GHOST = .5, ITEM_COLORS = [0x4fc3f7, 0xffb74d, 0x81c784, 0xf06292, 0xba68c8, 0xfff176, 0x4db6ac, 0xff8a65];
let radar = null, lastFind = null;
function drawItems(res) {
  itemsG.clear();
  lastFind = res.n;
  const tz = S?.table_z ?? 0, items = (res.items || []).filter(i => i.board && i.on_board !== false);
  const kinds = [...new Set(items.map(i => i.what))];
  for (const it of items) {
    const b = it.board, h = Math.max(it.height_mm ?? b.top ?? 2, 1.5), col = ITEM_COLORS[kinds.indexOf(it.what) % ITEM_COLORS.length];
    const g = new THREE.Group();
    g.position.copy(P(b.x, b.y, tz));
    g.rotation.y = b.angle * Math.PI / 180;
    const solid = (geo, y) => {
      const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: col, transparent: true, opacity: .45, roughness: .6, depthWrite: false }));
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: col, transparent: true }));
      m.position.y = e.position.y = y; g.add(m, e);
    };
    if (b.round && it.count) {                        // a stack: one disc per chip
      const t = h / it.count;
      for (let k = 0; k < it.count; k++) solid(new THREE.CylinderGeometry(b.w / 2, b.w / 2, t * .85, 32), t * (k + .5));
    } else solid(b.round ? new THREE.CylinderGeometry(b.w / 2, b.w / 2, h, 32) : new THREE.BoxGeometry(b.h, h, b.w), h / 2);
    itemsG.add(g);
    if (it.pick) {                                     // where the cup would go
      const t = new THREE.Mesh(new THREE.RingGeometry(4, 7.5, 24), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, side: THREE.DoubleSide }));
      t.rotation.x = -Math.PI / 2; t.position.copy(P(it.pick.x, it.pick.y, tz + h + .5)); itemsG.add(t);
    }
    const label = makeLabel((it.answer ? answerText(it.answer) : it.what) + (it.count ? ` ×${it.count}` : '') + (it.known && !it.flat && it.fit != null ? ' ?' : ''), col);
    label.position.copy(P(b.x, b.y, tz + h + 22)); itemsG.add(label);
  }
  const t = new Date((res.at || Date.now() / 1000) * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  $('lasttext').textContent = `${items.length} ${items.length === 1 ? 'item' : 'items'} · ${t}`;
  itemsG.traverse(o => { if (o.material) o.material.opacity = (o.material.opacity ?? 1) * GHOST; });
  $('last').hidden = false;
  $('poly').hidden = !items.length;
}
function sweep() {
  if (!radar) return;                                 // a sweep growing out from the board's middle
  const t = (performance.now() - radar.at) / 1600 % 1;
  radar.mesh.scale.setScalar(.05 + t); radar.mesh.material.opacity = .5 * (1 - t);
}

// ---- low-poly models: /api/find/shapes gives each thing as a few solids; its footprint places them ----
function solid(kind, len, tall, wide, along) {
  // one part, centred, its length on x (lying) or y (standing); cones and wedges narrow towards +;
  // a ring is a band around that axis
  let g;
  if (kind === 'box') g = new THREE.BoxGeometry(1, 1, 1);
  else if (kind === 'sphere') g = new THREE.SphereGeometry(.5, 8, 6);
  else if (kind === 'wedge') {
    const sh = new THREE.Shape([new THREE.Vector2(-.5, -.5), new THREE.Vector2(.5, -.5), new THREE.Vector2(-.5, .5)]);
    g = new THREE.ExtrudeGeometry(sh, { depth: 1, bevelEnabled: false }).translate(0, 0, -.5);
    if (!along) g.rotateZ(Math.PI / 2);
  } else {
    g = kind === 'ring' ? new THREE.TorusGeometry(.375, .125, 6, 16).rotateX(Math.PI / 2).scale(1, 4, 1)
                        : new THREE.CylinderGeometry(kind === 'cone' ? 0 : .5, .5, 1, 8);
    if (along) g.rotateZ(-Math.PI / 2);
  }
  return along ? g.scale(len, tall, wide) : g.scale(tall, len, wide);
}
function topText(text, w, l) {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = /[♥♦]/.test(text) ? '#c62828' : '#111'; g.font = 'bold 110px -apple-system, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 128, 132);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(Math.min(w, l), Math.min(w, l)),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true }));
  m.rotation.x = -Math.PI / 2; m.rotation.z = Math.PI / 2;
  return m;
}
function drawPolys(res) {
  itemsG.clear();
  const tz = S?.table_z ?? 0;
  for (const it of res.items) {
    const b = it.board, s = it.shape, g = new THREE.Group();
    g.position.copy(P(b.x, b.y, tz));
    g.rotation.y = b.angle * Math.PI / 180;
    const parts = s?.parts?.length ? s.parts : [{ shape: 'box', from: 0, to: 1, size: 1, color: '#888888' }];
    const L = b.h, W = b.w, H = s ? s.height_mm : 4;
    // round footprint, all cylinders, yet "along": Muse means discs seen from above (a plate), not a log
    const discs = s?.axis !== 'up' && W / L > .85 && parts.every(p => p.shape === 'cylinder' || p.shape === 'cone');
    const along = !discs && (!s || s.axis !== 'up');
    let top = 0;
    for (const p of parts) {
      const span = Math.max(p.to - p.from, .02), mid = (p.from + p.to) / 2 - .5;
      const mat = new THREE.MeshStandardMaterial({ color: p.color, flatShading: true, roughness: .75 });
      let m;
      if (discs) {
        const tall = H * p.size;
        m = new THREE.Mesh(solid('cylinder', tall, span * L, span * W, false), mat);
        m.position.set(0, tall / 2, 0);
        top = Math.max(top, tall);
      } else if (along) {
        const tall = H * (p.tall ?? p.size), lift = H * (p.lift ?? 0);
        m = new THREE.Mesh(solid(p.shape, span * L, tall, W * p.size, true), mat);
        m.position.set(mid * L, lift + tall / 2, (p.side ?? 0) * W);
        top = Math.max(top, lift + tall);
      } else {
        m = new THREE.Mesh(solid(p.shape, span * H, L * p.size, W * p.size, false), mat);
        m.position.set(0, (mid + .5) * H, (p.side ?? 0) * W);
        top = Math.max(top, p.to * H);
      }
      g.add(m);
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry, 30), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: .25 }));
      e.position.copy(m.position); g.add(e);
    }
    if (s?.top) { const t = topText(s.top, W, L); t.position.y = top + .2; g.add(t); }
    itemsG.add(g);
  }
  $('poly').hidden = false;
}
$('poly').onclick = async () => {
  $('poly').disabled = true; $('poly').classList.add('busy'); scanSay('Modelling');
  try {
    const r = await fetch('/api/find/shapes?by=scene' + (lastFind ? '&n=' + lastFind : '')).then(r => r.json());
    if (!r.items) throw new Error(r.detail || 'no answer');
    drawPolys(r);
    scanSay(r.items.some(i => i.error) ? 'Some came back as plain blocks' : '', r.items.some(i => i.error));
  } catch (e) { scanSay('Render failed: ' + e.message, true); }
  finally { $('poly').disabled = false; $('poly').classList.remove('busy'); }
};
function startRadar() {
  const tz = S?.table_z ?? 0, r = table ? table.size * .7 : 300;
  const m = new THREE.Mesh(new THREE.RingGeometry(r * .92, r, 64), new THREE.MeshBasicMaterial({ color: 0xf5a524, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.copy(P(table?.cx ?? 0, table?.cy ?? 0, tz + 1)); scene.add(m);
  radar = { mesh: m, at: performance.now() };
}
function stopRadar() { if (radar) { scene.remove(radar.mesh); radar = null; } }
const scanSay = (t, bad) => { $('scanmsg').textContent = t; $('scaninfo').hidden = !t; $('scaninfo').classList.toggle('bad', !!bad); };   // a dot and a word, no box
$('scan').onclick = async () => {
  $('scan').disabled = true; $('scan').classList.add('busy'); itemsG.clear(); $('last').hidden = true; $('poly').hidden = true; scanSay('Looking'); startRadar();
  try {
    let r = await fetch('/api/see?by=scene').then(r => r.json());
    if (!r.things) throw new Error(r.detail || 'no answer');
    if (!r.things.length) { scanSay('Nothing on the board', true); return; }
    r = await fetch('/api/find?by=scene&what=' + encodeURIComponent(r.things.map(t => t.find).join(','))).then(r => r.json());
    if (!r.items) throw new Error(r.detail || 'no answer');
    drawItems(r);
    scanSay('');
  } catch (e) { scanSay('Scan failed: ' + e.message, true); }
  finally { stopRadar(); $('scan').disabled = false; $('scan').classList.remove('busy'); }
};

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
camera.position.set(0, 600, 800); controls.update();
renderer.setAnimationLoop(() => { controls.update(); sweep(); renderer.render(scene, camera); });

fetch('/api/scene').then(r => r.json()).then(render).catch(() => {});
connect();
</script>
</body>
</html>
